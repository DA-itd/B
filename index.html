  <script>
    // ============================================================
    // 1. CONFIGURACIÓN
    // ============================================================
    const GOOGLE_CLIENT_ID = "916349562772-n5pib46levgf06pagh80hanbmdb6cg2c.apps.googleusercontent.com";
    
    // Logo oficial institucional del Instituto Tecnológico de Durango (GitHub público / local)
    const LOGO_URL = "https://raw.githubusercontent.com/DA-itd/web/main/logo_itdurango.png";
    
    const CONSTANCIAS_URLS = {

      '2025': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPv6H23fdWHrV524E1utHZdSWnT5DgovAScE2cFKH8b3gGxycnB7FJ1R-e1hxqyKYEXMmSGZnoNuv3/pub?gid=763823969&single=true&output=csv',
      '2026': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPv6H23fdWHrV524E1utHZdSWnT5DgovAScE2cFKH8b3gGxycnB7FJ1R-e1hxqyKYEXMmSGZnoNuv3/pub?gid=2076074898&single=true&output=csv'
    };
    
    const ADMIN_EMAILS = ['alejandro.calderon@itdurango.edu.mx', 'coord_actualizaciondocente@itdurango.edu.mx'];
    const ADMIN_PASSWORD = "X987ela";
    const GENERAR_CONSTANCIA_URL = "https://script.google.com/macros/s/AKfycbxRpN34MVIg3XVJYfV80WOzNilDpVJEMSw9RuMc7PI49zH1Wl-z2Si8hLxCzOMiJaQSpA/exec";
    const FECHA_APERTURA = new Date('2026-06-29T00:00:00');
    
    // ============================================================
    // 2. REACT Y UTILIDADES
    // ============================================================
    const React = window.React;
    const ReactDOM = window.ReactDOM;

    const { createRoot } = ReactDOM;
    const h = React.createElement;
    
    // ============================================================
    // 3. ICONOS
    // ============================================================
    const Icon = (props, children) => h('svg', {

    const MailIcon = (p) => Icon(p, [

    ]);
    const FileDownIcon = (p) => Icon(p, [

    const LogOutIcon = (p) => Icon(p, [

    ]);
    const SearchIcon = (p) => Icon(p, [

      h('line', { x1: 21, y1: 21, x2: 16.65, y2: 16.65 })
    ]);
    const DownloadIcon = (p) => Icon(p, [
      h('path', { d: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" }),
      h('polyline', { points: "7 10 12 15 17 10" }),
      h('line', { x1: 12, y1: 15, x2: 12, y2: 3 })
    ]);
    const LockIcon = (p) => Icon(p, [
      h('rect', { x: 3, y: 11, width: 18, height: 11, rx: 2, ry: 2 }),
      h('path', { d: "M7 11V7a5 5 0 0 1 10 0v4" })
    ]);
    const AlertIcon = (p) => Icon(p, [
      h('circle', { cx: 12, cy: 12, r: 10 }),
      h('line', { x1: 12, y1: 8, x2: 12, y2: 12 }),
      h('line', { x1: 12, y1: 16, x2: 12.01, y2: 16 })
    ]);
    const AwardIcon = (p) => Icon(p, [
      h('path', { d: "M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" }),
      h('polyline', { points: "9 12 11 14 15 10" })
    ]);
    const ClockIcon = (p) => Icon(p, [
      h('circle', { cx: 12, cy: 12, r: 10 }),
      h('polyline', { points: "12 6 12 12 16 14" })
    ]);
    const FileTextIcon = (p) => Icon(p, [
      h('path', { d: "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" }),
      h('polyline', { points: "14 2 14 8 20 8" }),
      h('line', { x1: "16", y1: "13", x2: "8", y2: "13" }),
      h('line', { x1: "16", y1: "17", x2: "8", y2: "17" }),
      h('polyline', { points: "10 9 9 9 8 9" })
    ]);
    
    // ============================================================
    // 4. HOOK CUENTA REGRESIVA
    // ============================================================
    const useCountdown = (targetDate) => {
      const calcular = () => {
        const diff = targetDate - new Date();
        if (diff <= 0) return { dias: 0, horas: 0, minutos: 0, segundos: 0, abierto: true };
        return {
          dias: Math.floor(diff / (1000 * 60 * 60 * 24)),
          horas: Math.floor((diff / (1000 * 60 * 60)) % 24),
          minutos: Math.floor((diff / (1000 * 60)) % 60),
          segundos: Math.floor((diff / 1000) % 60),
          abierto: false
        };
      };
      const [tiempo, setTiempo] = useState(calcular);
      useEffect(() => {
        const id = setInterval(() => setTiempo(calcular()), 1000);
        return () => clearInterval(id);
      }, [targetDate]);
      return tiempo;
    };
    
    // ============================================================
    // 5. PARSER CSV Y HELPERS
    // ============================================================
    const normalize = (str) => str ? str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() : "";
    
    const parseCSVLine = (line) => {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          if (inQuotes && line[i + 1] === '"') { current += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else { current += char; }
      }
      result.push(current.trim());
      return result;
    };
    
    const cleanCSVValue = (val) => {
      let cleaned = (val || '').trim();
      if (cleaned.startsWith('"') && cleaned.endsWith('"')) {
        cleaned = cleaned.substring(1, cleaned.length - 1).replace(/""/g, '"');
      }
      return cleaned;
    };
    
    const decodeJwtResponse = (token) => {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        return JSON.parse(jsonPayload);
      } catch(e) { return null; }
    };
    
    // ============================================================
    // 6. OBTENER CONSTANCIAS DESDE GOOGLE SHEETS CSV
    // ============================================================
    const getConstancias = async (year) => {
      try {
        const url = CONSTANCIAS_URLS[year];
        if (!url) return [];
        const response = await fetch(`${url}&_=${Date.now()}`);
        if (!response.ok) throw new Error('Error al cargar constancias');
        const csvText = await response.text();
        const lines = csvText.trim().split(/\r?\n/);
        if (lines.length < 2) return [];
        
        const headers = parseCSVLine(lines[0]);
        const findCol = (keywords) => headers.findIndex(h => keywords.some(k => normalize(h).includes(normalize(k))));
        
        const idx = {
          nombre: findCol(['nombre', 'participante', 'docente', 'alumno', 'name']),
          correo: findCol(['emailaddress', 'correo', 'email', 'mail', 'e-mail']),
          curso: findCol(['codigo', 'curso', 'taller', 'reconocimiento', 'concepto', 'actividad', 'clave', 'code']),
          fecha: findCol(['año', 'fecha', 'periodo', 'year', 'date']),
          status: findCol(['status', 'estatus', 'estado']),
          link: findCol(['fileattachments', 'link', 'url', 'pdf', 'descarga', 'archivo', 'constancia'])
        };
        
        if (idx.correo === -1) return [];
        
        return lines.slice(1).map(line => {
          const values = parseCSVLine(line);
          if (values.length < 2) return null;
          const rawLink = idx.link !== -1 ? cleanCSVValue(values[idx.link]) : '';
          
          // Limpieza de /u/0/ y /u/2/ en enlaces de Google Drive para evitar 404
          const safeLink = rawLink.replace(/\/u\/\d+\//g, '/');
          
          return {
            id: Math.random().toString(36).substr(2, 9),
            nombre: idx.nombre !== -1 ? cleanCSVValue(values[idx.nombre]) : 'Usuario ITD',
            correo: cleanCSVValue(values[idx.correo]).toLowerCase(),
            curso: idx.curso !== -1 ? cleanCSVValue(values[idx.curso]) : 'Documento ITD',
            fecha: idx.fecha !== -1 ? cleanCSVValue(values[idx.fecha]) : year,
            status: idx.status !== -1 ? cleanCSVValue(values[idx.status]).toUpperCase().trim() : 'ENVIADO',
            link: safeLink,
            year: year
          };
        }).filter(item => item && item.correo);
      } catch (error) {
        console.error("Error al obtener constancias:", error);
        return [];
      }
    };
    
    // ============================================================
    // 7. COMPONENTE LOGIN
    // ============================================================
    const Login = ({ onLogin }) => {
      const [error, setError] = useState('');
      const [showModal, setShowModal] = useState(false);
      const [adminPass, setAdminPass] = useState('');
      const [adminError, setAdminError] = useState('');
      const [constActivada, setConstActivada] = useState(() => {
        try { return localStorage.getItem('constActivada') === 'true'; } catch(e) { return false; }
      });
      const googleInitialized = useRef(false);
      const countdown = useCountdown(FECHA_APERTURA);
      const estaActiva = constActivada || countdown.abierto;
      
      // abrirConstancia inicia sesión del docente y muestra sus constancias
      // sin redirigir toda la ventana a /macros/u/2/ (evitando la pantalla 404 de Google Drive)
      const abrirConstancia = () => {
        const input = document.getElementById('inputUsuarioConstancia');
        const prefijo = (input ? input.value : '').replace(/@.*$/, '').trim().toLowerCase();
        if (!prefijo) { 
          if (input) { input.style.border = '1.5px solid #e05050'; setTimeout(() => { input.style.border = ''; }, 1500); }
          return; 
        }
        const email = prefijo + '@itdurango.edu.mx';
        const isAdmin = ADMIN_EMAILS.includes(email);
        onLogin({ email: email, name: prefijo.toUpperCase(), picture: '', isAdmin: isAdmin });
      };
      
      const handleAdminToggle = () => {
        if (adminPass !== ADMIN_PASSWORD) { setAdminError('Clave incorrecta.'); return; }
        const nuevo = !constActivada;
        setConstActivada(nuevo);
        try { localStorage.setItem('constActivada', String(nuevo)); } catch(e) {}
        setShowModal(false);
        setAdminPass('');
        setAdminError('');
      };
      
      const handleCredentialResponse = (response) => {
        const payload = decodeJwtResponse(response.credential);
        if (!payload || !payload.email) { setError('No se pudo verificar la identidad.'); return; }
        const email = payload.email.toLowerCase();
        const isAdmin = ADMIN_EMAILS.includes(email);
        onLogin({ email, name: payload.name, picture: payload.picture, isAdmin });
      };
      
      useEffect(() => {
        let attempts = 0;
        const renderGoogleButton = () => {
          if (googleInitialized.current || !window.google) {
            if (attempts < 10) { attempts++; setTimeout(renderGoogleButton, 400); }
            return;
          }
          const container = document.getElementById("googleSignInDiv");
          if (!container) {
            if (attempts < 10) { attempts++; setTimeout(renderGoogleButton, 300); }
            return;
          }
          if (container.hasChildNodes()) { googleInitialized.current = true; return; }
          try {
            window.google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse });
            window.google.accounts.id.renderButton(container, { theme: "outline", size: "large", width: "100%", text: "continue_with" });
            googleInitialized.current = true;
          } catch(err) {
            if (attempts < 10) { attempts++; setTimeout(renderGoogleButton, 500); }
          }
        };
        renderGoogleButton();
      }, []);
      
      const S = {
        page: { minHeight: '100vh', background: 'linear-gradient(150deg, #f8f4ec 0%, #efe7d5 45%, #e8f0f8 100%)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '2rem 1rem', fontFamily: "'DM Sans','Inter',sans-serif", position: 'relative', overflow: 'hidden' },
        bgDeco: { position: 'absolute', inset: 0, pointerEvents: 'none', background: 'radial-gradient(ellipse 70% 50% at 15% 5%, rgba(107,26,42,.08) 0%, transparent 55%), radial-gradient(ellipse 50% 40% at 85% 95%, rgba(26,58,92,.08) 0%, transparent 50%)' },
        header: { textAlign: 'center', marginBottom: '2rem', position: 'relative', animation: 'fadeUp .5s cubic-bezier(.22,.68,0,1.2) both' },
        logoWrap: { position: 'relative', width: 96, height: 114, margin: '0 auto 1.25rem', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' },
        logoRing: { position: 'absolute', width: 84, height: 84, top: 4, borderRadius: '50%', border: '1.5px solid rgba(196,154,53,.45)', animation: 'ringPulse 2.8s ease-out infinite', pointerEvents: 'none' },
        logoRing2: { position: 'absolute', width: 84, height: 84, top: 4, borderRadius: '50%', border: '1.5px solid rgba(196,154,53,.25)', animation: 'ringPulse 2.8s 1.4s ease-out infinite', pointerEvents: 'none' },
        logoImg: { width: '100%', height: '100%', objectFit: 'contain', display: 'block', margin: '0 auto', filter: 'drop-shadow(0 4px 16px rgba(107,26,42,.22))' },
        h1: { fontFamily: "'Playfair Display','Georgia',serif", fontSize: 'clamp(1.55rem,5vw,2.1rem)', fontWeight: 900, color: '#3D0A14', margin: '0 0 .35rem', letterSpacing: '-.015em', lineHeight: 1.15 },
        sub: { fontSize: '.83rem', color: '#6B6B7B', margin: 0 },
        grid: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '1.1rem', width: '100%', maxWidth: 760, animation: 'fadeUp .55s .1s cubic-bezier(.22,.68,0,1.2) both' },
        card: (accent) => ({ background: '#fff', borderRadius: 22, overflow: 'hidden', boxShadow: `0 4px 8px rgba(0,0,0,.04), 0 24px 52px ${accent}, 0 0 0 1px rgba(196,154,53,.12)`, display: 'flex', flexDirection: 'column' }),
        stripe: (g) => ({ height: 5, backgroundSize: '200% 100%', animation: 'shimmer 4s linear infinite', background: g }),
        cardBody: { padding: '1.7rem 1.9rem', flex: 1, display: 'flex', flexDirection: 'column' },
        iconWrap: (bg, shadow) => ({ width: 46, height: 46, borderRadius: 13, flexShrink: 0, background: bg, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: shadow }),
        cardTitle: { fontWeight: 700, fontSize: '1.02rem', color: '#1A1720', lineHeight: 1.2 },
        cardSub: { fontSize: '.74rem', color: '#6B6B7B', marginTop: '.08rem' },
        desc: { fontSize: '.82rem', color: '#5A5A6A', lineHeight: 1.62, margin: '1rem 0 1.2rem' },
        authNote: { display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '.35rem', fontSize: '.7rem', color: '#A0A0B0', marginTop: '.5rem' },
        footer: { marginTop: '1.8rem', textAlign: 'center', fontSize: '.68rem', color: 'rgba(80,65,55,.55)', animation: 'fadeUp .5s .3s ease both', letterSpacing: '.02em' }
      };
      
      return h('div', { style: S.page },
        h('div', { style: S.bgDeco }),
        
        // Modal Admin
        showModal && h('div', { style: { position: 'fixed', inset: 0, zIndex: 1000, background: 'rgba(0,0,0,.45)', backdropFilter: 'blur(4px)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem' }, onClick: (e) => { if (e.target === e.currentTarget) { setShowModal(false); setAdminPass(''); setAdminError(''); } } },
          h('div', { style: { background: '#fff', borderRadius: 18, overflow: 'hidden', width: '100%', maxWidth: 320, boxShadow: '0 24px 60px rgba(0,0,0,.25)' } },
            h('div', { style: { height: 4, background: 'linear-gradient(90deg,#3D0A14,#6B1A2A,#C49A35,#6B1A2A,#3D0A14)' } }),
            h('div', { style: { padding: '1.5rem 1.7rem' } },
              h('div', { style: { textAlign: 'center', marginBottom: '1.1rem' } },
                h('div', { style: { fontSize: '1.7rem', marginBottom: '.3rem' } }, constActivada ? '🔒' : '✅'),
                h('div', { style: { fontFamily: "'Playfair Display',serif", fontWeight: 700, fontSize: '1.05rem', color: '#3D0A14' } }, constActivada ? 'Desactivar Tarjeta 2' : 'Activar Tarjeta 2'),
                h('div', { style: { fontSize: '.73rem', color: '#9090A0', marginTop: '.2rem' } }, 'Clave de administración')
              ),
              h('input', { type: 'password', value: adminPass, onChange: (e) => { setAdminPass(e.target.value); setAdminError(''); }, onKeyDown: (e) => e.key === 'Enter' && handleAdminToggle(), placeholder: '••••••••', autoFocus: true, style: { width: '100%', padding: '.72rem 1rem', border: `1.5px solid ${adminError ? '#e05050' : '#e0e0e0'}`, borderRadius: 10, fontSize: '.9rem', outline: 'none', marginBottom: '.5rem', boxSizing: 'border-box' } }),
              adminError && h('div', { style: { fontSize: '.72rem', color: '#c0392b', marginBottom: '.5rem' } }, adminError),
              h('button', { onClick: handleAdminToggle, style: { width: '100%', padding: '.72rem', background: 'linear-gradient(135deg,#1B396A,#2B5580)', color: '#fff', border: 'none', borderRadius: 10, fontWeight: 700, fontSize: '.88rem', cursor: 'pointer', marginBottom: '.5rem' } }, constActivada ? 'Desactivar' : 'Activar'),
              h('button', { onClick: () => { setShowModal(false); setAdminPass(''); setAdminError(''); }, style: { width: '100%', padding: '.52rem', background: 'transparent', border: '1.5px solid #e8e8e8', borderRadius: 10, fontSize: '.8rem', color: '#9090A0', cursor: 'pointer' } }, 'Cancelar')
            )
          )
        ),
        
        // Header
        h('div', { style: S.header },
          h('div', { 
            style: S.logoWrap, 
            title: 'Instituto Tecnológico de Durango',
            onClick: () => { setShowModal(true); setAdminPass(''); setAdminError(''); } 
          },
            h('div', { style: S.logoRing }),
            h('div', { style: S.logoRing2 }),
            h('img', { 
              src: LOGO_URL, 
              alt: 'Logo ITD', 
              style: S.logoImg,
              onError: (e) => {
                e.currentTarget.onerror = null;
                e.currentTarget.src = './logo_itdurango.png';
              }
            })
          ),
          h('h1', { style: S.h1 }, 'Constancias y ', h('em', { style: { fontStyle: 'italic', color: '#922438' } }, 'Reconocimientos')),
          h('p', { style: S.sub }, 'Instituto Tecnológico de Durango — Portal ITD')
        ),
        
        // Grid
        h('div', { style: S.grid },
          // Tarjeta 1 - Mis Constancias (Google Sign-In)
          h('div', { style: S.card('rgba(107,26,42,.12)') },
            h('div', { style: S.stripe('linear-gradient(90deg,#3D0A14 0%,#6B1A2A 28%,#C49A35 50%,#6B1A2A 72%,#3D0A14 100%)') }),
            h('div', { style: S.cardBody },
              h('div', { style: { display: 'flex', alignItems: 'center', gap: '.85rem', marginBottom: '.2rem' } },
                h('div', { style: S.iconWrap('linear-gradient(135deg,#3D0A14,#922438)', '0 3px 14px rgba(107,26,42,.28)') }, h(FileTextIcon, { size: 21, color: '#F5E4A8' })),
                h('div', null,
                  h('div', { style: S.cardTitle }, 'Mis Constancias del 2025 y Enero 2026'),
                  h('div', { style: S.cardSub }, 'Descarga tus documentos')
                )
              ),
              h('p', { style: S.desc }, 'Inicia sesión con tu cuenta ', h('strong', { style: { color: '#1B396A' } }, '@itdurango.edu.mx'), ' para ver y descargar tus constancias.'),
              h('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', gap: '.6rem' } },
                h('div', { id: 'googleSignInDiv', style: { width: '100%', minHeight: 44 } }),
                error && h('div', { style: { display: 'flex', alignItems: 'center', gap: '.5rem', padding: '.7rem .9rem', background: '#fef2f2', border: '1.5px solid rgba(220,80,80,.18)', borderRadius: 10, fontSize: '.78rem', color: '#7A1E1E' } }, h(AlertIcon, { size: 14 }), ' ', error),
                h('div', { style: S.authNote }, h(LockIcon, { size: 11 }), ' Autenticación segura con Google')
              )
            )
          ),
          
          // Tarjeta 2 - Acceso por usuario institucional (SIN ERROR 404)
          h('div', { style: { ...S.card('rgba(26,58,92,.1)'), opacity: estaActiva ? 1 : 0.65 } },
            h('div', { style: S.stripe(estaActiva ? 'linear-gradient(90deg,#1B396A 0%,#2B5580 35%,#C49A35 55%,#2B5580 75%,#1B396A 100%)' : 'linear-gradient(90deg,#999 0%,#bbb 50%,#999 100%)') }),
            h('div', { style: S.cardBody },
              h('div', { style: { display: 'flex', alignItems: 'center', gap: '.85rem', marginBottom: '.2rem' } },
                h('div', { style: S.iconWrap(estaActiva ? 'linear-gradient(135deg,#1B396A,#2B5580)' : 'linear-gradient(135deg,#999,#bbb)', estaActiva ? '0 3px 14px rgba(26,58,92,.25)' : 'none') },
                  estaActiva ? h(AwardIcon, { size: 21, color: '#F5E4A8' }) : h(LockIcon, { size: 21, color: '#fff' })
                ),
                h('div', null,
                  h('div', { style: S.cardTitle }, 'Generar / Ver Mis Constancias'),
                  h('div', { style: { ...S.cardSub, fontWeight: 700, color: '#1B396A' } }, 'Cursos 2024, 2025 y 2026')
                )
              ),
              h('p', { style: S.desc }, 'Ingresa tu usuario institucional para consultar y descargar directamente todas tus constancias acreditadas.'),
              h('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', gap: '.55rem' } },
                h('div', { style: { display: 'flex', borderRadius: 12, overflow: 'hidden', border: '1.5px solid #d1d5db', background: '#fff', boxShadow: '0 1px 4px rgba(0,0,0,.06)' } },
                  h('input', { 
                    id: 'inputUsuarioConstancia',
                    type: 'text', 
                    placeholder: 'tu.usuario', 
                    autoComplete: 'off',
                    onKeyDown: (e) => { if (e.key === 'Enter') abrirConstancia(); },
                    style: { flex: 1, padding: '.72rem .9rem', border: 'none', outline: 'none', fontSize: '.88rem', color: '#1A1720', background: 'transparent' }
                  }),
                  h('span', { style: { display: 'flex', alignItems: 'center', padding: '.72rem .75rem .72rem 0', fontSize: '.78rem', color: '#9090A0', whiteSpace: 'nowrap', userSelect: 'none' } }, '@itdurango.edu.mx')
                ),
                h('button', { 
                  onClick: abrirConstancia,
                  style: { width: '100%', padding: '.82rem 1rem', background: 'linear-gradient(135deg,#1B396A,#2B5580)', color: '#F5E4A8', border: 'none', borderRadius: 12, fontWeight: 700, fontSize: '.9rem', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '.5rem', boxShadow: '0 4px 14px rgba(26,58,92,.30)' } },
                  h(AwardIcon, { size: 16, color: '#F5E4A8' }), 
                  ' Consultar Mis Constancias'
                ),
                h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '.35rem', fontSize: '.7rem', color: '#A0A0B0' } },
                  h(LockIcon, { size: 11 }), 
                  ' Acceso directo con tu correo institucional'
                )
              )
            )
          ),
          
          // Tarjeta 3 - Desarrollo Académico (Uso Interno)
          h('a', { 
            href: './otras-constancias.html', 
            style: { ...S.card('rgba(107,26,42,.1)'), cursor: 'pointer', textDecoration: 'none', transition: 'transform .2s, box-shadow .2s' }, 
            onMouseEnter: (e) => { e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.boxShadow = '0 8px 16px rgba(0,0,0,.07),0 32px 64px rgba(107,26,42,.15)'; }, 
            onMouseLeave: (e) => { e.currentTarget.style.transform = ''; e.currentTarget.style.boxShadow = ''; } 
          },
            h('div', { style: S.stripe('linear-gradient(90deg,#3D0A14 0%,#6B1A2A 28%,#C49A35 50%,#6B1A2A 72%,#3D0A14 100%)') }),
            h('div', { style: S.cardBody },
              h('div', { style: { display: 'flex', alignItems: 'center', gap: '.85rem', marginBottom: '.2rem' } },
                h('div', { style: S.iconWrap('linear-gradient(135deg,#3D0A14,#922438)', '0 3px 14px rgba(107,26,42,.28)') },
                  h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 38 38', width: 22, height: 22 },
                    h('path', { d: 'M19 2 L36 2 L36 28 Q27.5 36 19 31 Q10.5 36 2 28 L2 2 Z', fill: 'rgba(255,255,255,0.15)', stroke: '#F5E4A8', strokeWidth: '1.8', opacity: '0.9' }),
                    h('circle', { cx: 19, cy: 18, r: 5.5, fill: 'none', stroke: '#F5E4A8', strokeWidth: '1.5', opacity: '0.85' }),
                    h('circle', { cx: 19, cy: 18, r: 2, fill: '#F5E4A8', opacity: '0.95' }),
                    h('line', { x1: 19, y1: 6, x2: 19, y2: 29, stroke: '#F5E4A8', strokeWidth: '1', opacity: '0.4' }),
                    h('line', { x1: 5, y1: 18, x2: 33, y2: 18, stroke: '#F5E4A8', strokeWidth: '1', opacity: '0.4' })
                  )
                ),
                h('div', null,
                  h('div', { style: S.cardTitle }, 'Desarrollo Académico'),
                  h('div', { style: S.cardSub }, 'Uso Interno')
                )
              ),
              h('p', { style: S.desc }, 'Genera constancias y reconocimientos personalizados con la plantilla oficial ITD. Ingresa nombres manualmente o carga un Excel. Incluye QR de verificación.'),
              h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '.5rem', padding: '.85rem 1rem', borderRadius: 12, background: 'linear-gradient(135deg,#3D0A14,#922438)', color: '#F5E4A8', fontWeight: 700, fontSize: '.84rem', boxShadow: '0 4px 18px rgba(107,26,42,.30)' } }, '📜 Acceder')
            )
          )
        ),
        
        h('div', { style: S.footer }, '© ', new Date().getFullYear(), ' Dr. Alejandro Calderón Rentería — Coordinación Docente ITD')
      );
    };
    
    // ============================================================
    // 8. COMPONENTE DASHBOARD
    // ============================================================
    const Dashboard = ({ user, onLogout }) => {
      const [year, setYear] = useState('2025');
      const [allData, setAllData] = useState([]);
      const [search, setSearch] = useState('');
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      
      const YEARS = ['2024', '2025', '2026'];
      
      useEffect(() => {
        const fetchData = async () => {
          setLoading(true);
          setError(null);
          try {
            const data = await getConstancias(year);
            setAllData(data);
            if (data.length === 0) {
              setError('No se encontraron registros para el año ' + year);
            }
          } catch (err) {
            setError('Error al cargar datos de las hojas de cálculo.');
          } finally {
            setLoading(false);
          }
        };
        fetchData();
      }, [year]);
      
      const filteredData = useMemo(() => {
        if (allData.length === 0) return [];
        return allData.filter(item => {
          if (user.isAdmin) return true;
          return item.correo === user.email.toLowerCase();
        });
      }, [allData, user]);
      
      const searchFiltered = useMemo(() => {
        if (!search) return filteredData;
        const term = normalize(search);
        return filteredData.filter(item => 
          normalize(item.nombre).includes(term) ||
          normalize(item.curso).includes(term) ||
          normalize(item.correo).includes(term)
        );
      }, [filteredData, search]);
      
      const handleShareEmail = (item) => {
        const subject = `Constancia ITD: ${item.curso}`;
        const body = `Hola ${item.nombre},\n\nAdjunto encontrarás el enlace para descargar tu constancia: "${item.curso}".\n\nEnlace de descarga: ${item.link}\n\nAtentamente,\nCoordinación de Actualización Docente\nInstituto Tecnológico de Durango`;
        window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      };

      const downloadReport = () => {
        if (!searchFiltered.length) return;
        const csvContent = "data:text/csv;charset=utf-8,"
          + "Nombre,Correo,Documento,Fecha,Status,Link\n"
          + searchFiltered.map(e => `"${e.nombre}","${e.correo}","${e.curso}","${e.fecha}","${e.status}","${e.link}"`).join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `constancias_${year}.csv`);
        document.body.appendChild(link);
        link.click();
      };
      
      return h('div', { className: 'min-h-screen bg-gray-50 font-sans flex flex-col' },
        h('nav', { className: 'bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm' },
          h('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8' },
            h('div', { className: 'flex justify-between h-16 items-center' },
              h('div', { className: 'flex items-center gap-3' },
                h('img', { 
                  src: LOGO_URL, 
                  className: 'h-11 w-auto object-contain', 
                  alt: 'ITD',
                  onError: (e) => {
                    e.currentTarget.onerror = null;
                    e.currentTarget.src = './logo_itdurango.png';
                  }
                }),
                h('div', { className: 'h-8 w-px bg-gray-300 hidden sm:block mx-1' }),
                h('span', { className: 'text-base md:text-lg font-bold text-itd-blue leading-tight' }, 'Descarga de Constancias y Reconocimientos')
              ),
              h('div', { className: 'flex items-center gap-3' },
                h('div', { className: 'w-8 h-8 rounded-full bg-itd-blue text-white flex items-center justify-center text-xs font-bold' },
                  user.email.charAt(0).toUpperCase()
                ),
                h('div', { className: 'hidden md:flex flex-col items-end' },
                  h('span', { className: 'text-xs font-bold text-gray-700' }, user.name || 'Docente ITD'),
                  h('span', { className: 'text-[10px] text-gray-500' }, user.email)
                ),
                user.isAdmin && h('span', { className: 'bg-itd-red text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase ml-2' }, 'Admin'),
                h('button', { 
                  onClick: onLogout, 
                  className: 'ml-2 flex items-center gap-2 px-3 py-2 text-gray-600 hover:text-red-700 hover:bg-red-50 rounded-lg transition-colors',
                  title: "Salir"
                },
                  h('span', { className: 'text-sm font-medium hidden sm:inline' }, 'Salir'),
                  h(LogOutIcon, { className: 'w-4 h-4' })
                )
              )
            )
          )
        ),
        
        h('main', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full' },
          h('div', { className: 'bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center' },
            h('div', { className: 'flex gap-4 w-full md:w-auto items-center' },
              h('span', { className: 'text-sm font-bold text-gray-500 uppercase' }, 'Año:'),
              h('select', { 
                value: year, 
                onChange: (e) => setYear(e.target.value),
                className: 'bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5'
              },
                YEARS.map(y => h('option', { key: y, value: y }, y))
              )
            ),
            h('div', { className: 'relative w-full md:w-96' },
              h('div', { className: 'absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none' }, h(SearchIcon, { className: 'w-4 h-4 text-gray-400' })),
              h('input', { 
                type: 'text', 
                value: search, 
                onChange: (e) => setSearch(e.target.value),
                className: 'bg-white border border-gray-300 text-gray-900 text-sm rounded-lg block w-full pl-10 p-2.5', 
                placeholder: 'Buscar por nombre o documento...'
              })
            ),
            user.isAdmin && h('button', { 
              onClick: downloadReport,
              className: 'flex items-center gap-2 px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-sm font-medium rounded-lg'
            },
              h(DownloadIcon, { className: 'w-4 h-4' }), ' Reporte'
            )
          ),
          
          loading && h('div', { className: 'flex flex-col items-center justify-center py-20 bg-white rounded-xl' },
            h('p', { className: 'text-gray-500 font-medium' }, 'Cargando constancias del ', year, '...')
          ),
          
          !loading && searchFiltered.length > 0 && h('div', { className: 'bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden' },
            h('div', { className: 'p-4 border-b bg-gray-50 font-bold text-xs text-gray-500 uppercase tracking-wider' },
              `Constancias Encontradas (${searchFiltered.length})`
            ),
            h('div', { className: 'divide-y divide-gray-100' },
              searchFiltered.map((item, idx) => 
                h('div', { key: idx, className: 'p-4 flex flex-col md:flex-row md:items-center justify-between gap-3 hover:bg-blue-50/50' },
                  h('div', null,
                    h('p', { className: 'font-bold text-gray-900 text-sm' }, item.curso),
                    h('p', { className: 'text-xs text-gray-500 mt-0.5' }, `${item.nombre} · ${item.fecha} · ${item.status}`)
                  ),
                  h('div', { className: 'flex items-center gap-2' },
                    item.link ? 
                      h('a', { 
                        href: item.link, 
                        target: '_blank', 
                        rel: 'noopener noreferrer',
                        className: 'inline-flex items-center gap-1.5 px-4 py-2 bg-itd-blue text-white rounded-lg text-xs font-bold hover:bg-opacity-90'
                      }, 
                        h(DownloadIcon, { className: 'w-3.5 h-3.5' }),
                        'Descargar PDF'
                      ) :
                      h('span', { className: 'text-xs text-gray-400 italic' }, 'Documento en trámite'),
                    item.link && h('button', {
                      onClick: () => handleShareEmail(item),
                      className: 'p-2 text-gray-500 hover:text-itd-blue hover:bg-gray-100 rounded-lg transition-colors',
                      title: 'Enviar por correo'
                    }, h(MailIcon, { className: 'w-4 h-4' }))
                  )
                )
              )
            )
          ),
          
          !loading && searchFiltered.length === 0 && h('div', { className: 'bg-white rounded-xl p-12 text-center text-gray-500' },
            `No hay constancias registradas para ${user.email} en el periodo ${year}.`
          )
        )
      );
    };
    
    // ============================================================
    // 9. APP ROOT
    // ============================================================
    const App = () => {
      const [user, setUser] = useState(null);
      return user ? h(Dashboard, { user: user, onLogout: () => setUser(null) }) : h(Login, { onLogin: (u) => setUser(u) });
    };
    
    createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
