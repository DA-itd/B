    // ============================================================

    const LOGO_URL = "https://github.com/DA-itd/web/blob/main/logo_itdurango.png?raw=true";

    const ADMIN_PASSWORD = "X987ela";
    const CONSTANCIAS_URL = "https://script.google.com/macros/s/AKfycbxRpN34MVIg3XVJYfV80WOzNilDpVJEMSw9RuMc7PI49zH1Wl-z2Si8hLxCzOMiJaQSpA/exec";
    
    // ============================================================

      h('polyline', { points: "9 12 11 14 15 10" })
    ]);
    
    const AwardIcon = (p) => Icon(p, [

      h('polyline', { points: "9 12 11 14 15 10" })
    ]);
    
    const ClockIcon = (p) => Icon(p, [
      h('circle', { cx: 12, cy: 12, r: 10 }),
      h('polyline', { points: "12 6 12 12 16 14" })
    ]);
    
    const FileTextIcon = (p) => Icon(p, [
      h('path', { d: "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" }),
      h('polyline', { points: "14 2 14 8 20 8" }),
      h('line', { x1: "16", y1: "13", x2: "8", y2: "13" }),
      h('line', { x1: "16", y1: "17", x2: "8", y2: "17" }),
      h('polyline', { points: "10 9 9 9 8 9" })
    ]);
    
    // ============================================================
    // 3. UTILIDADES DE DATOS
    // ============================================================
    const normalize = (str) => str ? str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() : "";
    
    const detectDelimiter = (text) => {
      if (!text) return ',';
      const firstLine = text.split('\n')[0] || '';
      return (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ';' : ',';
    };
    
    const parseCSV = (text) => {
      if (!text) return [];
      const delimiter = detectDelimiter(text);
      const rows = [];
      let currentRow = [], currentField = '', inQuotes = false;
      
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '"' && text[i+1] === '"') { currentField += '"'; i++; }
        else if (char === '"') { inQuotes = !inQuotes; }
        else if (char === delimiter && !inQuotes) { currentRow.push(currentField); currentField = ''; }
        else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && text[i+1] === '\n') i++;
          currentRow.push(currentField); rows.push(currentRow); currentRow = []; currentField = '';
        } else { currentField += char; }
      }
      if (currentField || currentRow.length > 0) { currentRow.push(currentField); rows.push(currentRow); }
      return rows;
    };
    
    const decodeJwtResponse = (token) => {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        return JSON.parse(jsonPayload);
      } catch(e) { return null; }
    };
    
    const fetchLocalData = async (year) => {
      const fileUrl = DATA_SOURCES[year];
      if (!fileUrl) return { data: [] };
      try {
        const response = await fetch(fileUrl);
        if (!response.ok) throw new Error('Error');
        const text = await response.text();
        const rows = parseCSV(text);
        if (rows.length < 2) return { data: [] };
        
        const headers = rows[0].map(h => normalize(h));
        const findCol = (keywords) => headers.findIndex(h => keywords.some(k => h.includes(normalize(k))));
        
        const idx = {
          nombre: findCol(['nombre', 'participante', 'docente']),
          correo: findCol(['emailaddress', 'correo', 'email']),
          curso: findCol(['codigo', 'curso', 'taller']),
          fecha: findCol(['año', 'fecha', 'periodo']),
          status: findCol(['status', 'estatus']),
          link: findCol(['fileattachments', 'link', 'url', 'pdf'])
        };
        
        if (idx.correo === -1) return { data: [] };
        
        const cleanData = rows.slice(1).map((r, i) => {
          if (r.length <= 1) return null;
          return {
            id: i,
            nombre: idx.nombre !== -1 ? r[idx.nombre] : 'Usuario',
            correo: (r[idx.correo] || '').trim().toLowerCase(),
            curso: idx.curso !== -1 ? r[idx.curso] : 'Documento',
            fecha: idx.fecha !== -1 ? r[idx.fecha] : year,
            status: idx.status !== -1 ? (r[idx.status] || 'PENDIENTE').toUpperCase().trim() : 'ENVIADO',
            link: idx.link !== -1 ? r[idx.link] : ''
          };
        }).filter(item => item && item.correo);
        
        return { data: cleanData };
      } catch(error) {
        return { data: [] };
      }
    };
    
    // ============================================================
    // 4. COMPONENTE LOGIN (SIN JSX)
    // ============================================================
    const Login = ({ onLogin }) => {
      const [error, setError] = useState('');
      const [logoError, setLogoError] = useState(false);
      const [showModal, setShowModal] = useState(false);
      const [adminPass, setAdminPass] = useState('');
      const [adminError, setAdminError] = useState('');
      const [constActivada, setConstActivada] = useState(() => {
        try { return localStorage.getItem('constActivada') === 'true'; } catch(e) { return false; }
      });
      const googleIntencion = useRef('login');
      
      const abrirConstancia = () => {
        const input = document.getElementById('inputUsuarioConstancia');
        const prefijo = (input ? input.value : '').replace(/@.*$/, '').trim().toLowerCase();
        if (!prefijo) { 
          if (input) { input.style.border = '1.5px solid #e05050'; setTimeout(() => { input.style.border = ''; }, 1500); }
          return; 
        }
        window.location.href = CONSTANCIAS_URL + '?email=' + encodeURIComponent(prefijo + '@itdurango.edu.mx');
      };
      
      const handleAdminToggle = () => {
        if (adminPass !== ADMIN_PASSWORD) { setAdminError('Clave incorrecta.'); return; }
        const nuevo = !constActivada;
        setConstActivada(nuevo);
        try { localStorage.setItem('constActivada', String(nuevo)); } catch(e) {}
        setShowModal(false);
        setAdminPass('');
        setAdminError('');
      };
      
      const handleCredentialResponse = (response) => {
        const payload = decodeJwtResponse(response.credential);
        if (!payload || !payload.email) { setError('No se pudo verificar la identidad.'); return; }
        const email = payload.email.toLowerCase();
        if (googleIntencion.current === 'constancia') {
          googleIntencion.current = 'login';
          if (!email.endsWith('@itdurango.edu.mx')) {
            setError('Usa tu cuenta @itdurango.edu.mx');
            setTimeout(() => setError(''), 4000);
            return;
          }
          window.location.href = CONSTANCIAS_URL + '?email=' + encodeURIComponent(email);
        } else {
          const isAdmin = ADMIN_EMAILS.includes(email);
          onLogin({ email, name: payload.name, picture: payload.picture, isAdmin });
        }
      };
      
      useEffect(() => {
        if (window.google && GOOGLE_CLIENT_ID !== "TU_CLIENT_ID_AQUI.apps.googleusercontent.com") {
          try {
            window.google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse });
            window.google.accounts.id.renderButton(
              document.getElementById("googleSignInDiv"),
              { theme: "outline", size: "large", width: "100%", text: "continue_with" }
            );
          } catch(err) {
            setError("Error al cargar servicios de Google.");
          }
        }
      }, []);
      
      const S = {
        page: { minHeight: '100vh', background: 'linear-gradient(150deg, #f8f4ec 0%, #efe7d5 45%, #e8f0f8 100%)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '2rem 1rem', fontFamily: "'DM Sans','Inter',sans-serif", position: 'relative', overflow: 'hidden' },
        bgDeco: { position: 'absolute', inset: 0, pointerEvents: 'none', background: 'radial-gradient(ellipse 70% 50% at 15% 5%, rgba(107,26,42,.08) 0%, transparent 55%), radial-gradient(ellipse 50% 40% at 85% 95%, rgba(26,58,92,.08) 0%, transparent 50%)' },
        header: { textAlign: 'center', marginBottom: '2rem', position: 'relative', animation: 'fadeUp .5s cubic-bezier(.22,.68,0,1.2) both' },
        logoWrap: { position: 'relative', width: 84, height: 84, margin: '0 auto 1rem' },
        logoRing: { position: 'absolute', inset: -8, borderRadius: '50%', border: '1.5px solid rgba(196,154,53,.5)', animation: 'ringPulse 2.8s ease-out infinite' },
        logoRing2: { position: 'absolute', inset: -8, borderRadius: '50%', border: '1.5px solid rgba(196,154,53,.3)', animation: 'ringPulse 2.8s 1.4s ease-out infinite' },
        logoImg: { width: '100%', height: '100%', objectFit: 'contain', borderRadius: '50%', background: '#fff', padding: 8, boxShadow: '0 4px 22px rgba(107,26,42,.2), 0 0 0 2.5px rgba(196,154,53,.65)' },
        h1: { fontFamily: "'Playfair Display','Georgia',serif", fontSize: 'clamp(1.55rem,5vw,2.1rem)', fontWeight: 900, color: '#3D0A14', margin: '0 0 .35rem', letterSpacing: '-.015em', lineHeight: 1.15 },
        sub: { fontSize: '.83rem', color: '#6B6B7B', margin: 0 },
        grid: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(288px, 1fr))', gap: '1.1rem', width: '100%', maxWidth: 760, animation: 'fadeUp .55s .1s cubic-bezier(.22,.68,0,1.2) both' },
        card: (accent) => ({ background: '#fff', borderRadius: 22, overflow: 'hidden', boxShadow: `0 4px 8px rgba(0,0,0,.04), 0 24px 52px ${accent}, 0 0 0 1px rgba(196,154,53,.12)`, display: 'flex', flexDirection: 'column' }),
        stripe: (g) => ({ height: 5, backgroundSize: '200% 100%', animation: 'shimmer 4s linear infinite', background: g }),
        cardBody: { padding: '1.7rem 1.9rem', flex: 1, display: 'flex', flexDirection: 'column' },
        iconWrap: (bg, shadow) => ({ width: 46, height: 46, borderRadius: 13, flexShrink: 0, background: bg, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: shadow }),
        cardTitle: { fontWeight: 700, fontSize: '1.02rem', color: '#1A1720', lineHeight: 1.2 },
        cardSub: { fontSize: '.74rem', color: '#6B6B7B', marginTop: '.08rem' },
        desc: { fontSize: '.82rem', color: '#5A5A6A', lineHeight: 1.62, margin: '1rem 0 1.2rem' },
        authNote: { display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '.35rem', fontSize: '.7rem', color: '#A0A0B0', marginTop: '.5rem' },
        footer: { marginTop: '1.8rem', textAlign: 'center', fontSize: '.68rem', color: 'rgba(80,65,55,.55)', animation: 'fadeUp .5s .3s ease both', letterSpacing: '.02em' }
      };
      
      return h('div', { style: S.page },
        h('div', { style: S.bgDeco }),
        
        // Modal
        showModal && h('div', { style: { position: 'fixed', inset: 0, zIndex: 1000, background: 'rgba(0,0,0,.45)', backdropFilter: 'blur(4px)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem' }, onClick: (e) => { if (e.target === e.currentTarget) { setShowModal(false); setAdminPass(''); setAdminError(''); } } },
          h('div', { style: { background: '#fff', borderRadius: 18, overflow: 'hidden', width: '100%', maxWidth: 320, boxShadow: '0 24px 60px rgba(0,0,0,.25)', animation: 'fadeUp .3s cubic-bezier(.22,.68,0,1.2) both' } },
            h('div', { style: { height: 4, background: 'linear-gradient(90deg,#3D0A14,#6B1A2A,#C49A35,#6B1A2A,#3D0A14)', backgroundSize: '200% 100%', animation: 'shimmer 3s linear infinite' } }),
            h('div', { style: { padding: '1.5rem 1.7rem' } },
              h('div', { style: { textAlign: 'center', marginBottom: '1.1rem' } },
                h('div', { style: { fontSize: '1.7rem', marginBottom: '.3rem' } }, constActivada ? '🔒' : '✅'),
                h('div', { style: { fontFamily: "'Playfair Display',serif", fontWeight: 700, fontSize: '1.05rem', color: '#3D0A14' } }, constActivada ? 'Desactivar Tarjeta 2' : 'Activar Tarjeta 2'),
                h('div', { style: { fontSize: '.73rem', color: '#9090A0', marginTop: '.2rem' } }, 'Ingresa la clave de administrador')
              ),
              h('input', { type: 'password', value: adminPass, onChange: (e) => { setAdminPass(e.target.value); setAdminError(''); }, onKeyDown: (e) => e.key === 'Enter' && handleAdminToggle(), placeholder: '••••••••', autoFocus: true, style: { width: '100%', padding: '.72rem 1rem', border: `1.5px solid ${adminError ? '#e05050' : '#e0e0e0'}`, borderRadius: 10, fontSize: '.9rem', fontFamily: "'DM Sans',sans-serif", outline: 'none', marginBottom: '.5rem', boxSizing: 'border-box', background: adminError ? '#fff5f5' : '#fff' } }),
              adminError && h('div', { style: { fontSize: '.72rem', color: '#c0392b', marginBottom: '.5rem', display: 'flex', alignItems: 'center', gap: '.3rem' } }, h(AlertIcon, { size: 12 }), ' ', adminError),
              h('button', { onClick: handleAdminToggle, style: { width: '100%', padding: '.72rem', background: constActivada ? 'linear-gradient(135deg,#555,#888)' : 'linear-gradient(135deg,#1B396A,#2B5580)', color: '#fff', border: 'none', borderRadius: 10, fontFamily: "'DM Sans',sans-serif", fontWeight: 700, fontSize: '.88rem', cursor: 'pointer', marginBottom: '.5rem' } }, constActivada ? '🔒 Desactivar' : '✅ Activar'),
              h('button', { onClick: () => { setShowModal(false); setAdminPass(''); setAdminError(''); }, style: { width: '100%', padding: '.52rem', background: 'transparent', border: '1.5px solid #e8e8e8', borderRadius: 10, fontFamily: "'DM Sans',sans-serif", fontSize: '.8rem', color: '#9090A0', cursor: 'pointer' } }, 'Cancelar')

              h('div', { style: { width: '100%', height: '100%', borderRadius: '50%', background: 'linear-gradient(135deg,#3D0A14,#6B1A2A)', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 22px rgba(107,26,42,.2), 0 0 0 2.5px rgba(196,154,53,.65)', flexDirection: 'column', gap: 2 } },
                h('span', { style: { fontSize: '.65rem', fontWeight: 900, color: '#F5E4A8', letterSpacing: '.1em', lineHeight: 1 } }, 'ITD'),
                h('span', { style: { fontSize: '.42rem', color: 'rgba(245,228,168,.6)', letterSpacing: '.06em', lineHeight: 1 } }, 'DURANGO')
              ) :
              h('img', { src: LOGO_URL, alt: 'ITD', style: S.logoImg, onError: () => setLogoError(true) })
          ),
          h('h1', { style: S.h1 }, 'Constancias y ', h('em', { style: { fontStyle: 'italic', color: '#922438' } }, 'Reconocimientos')),
          h('p', { style: S.sub }, 'Instituto Tecnológico de Durango — Portal ITD')
        ),
        
        // Grid
        h('div', { style: S.grid },
          // Tarjeta 1
          h('div', { style: S.card('rgba(107,26,42,.12)') },
            h('div', { style: S.stripe('linear-gradient(90deg,#3D0A14 0%,#6B1A2A 28%,#C49A35 50%,#6B1A2A 72%,#3D0A14 100%)') }),
            h('div', { style: S.cardBody },
              h('div', { style: { display: 'flex', alignItems: 'center', gap: '.85rem', marginBottom: '.2rem' } },
                h('div', { style: S.iconWrap('linear-gradient(135deg,#3D0A14,#922438)', '0 3px 14px rgba(107,26,42,.28)') }, h(FileTextIcon, { size: 21, color: '#F5E4A8' })),
                h('div', null,
                  h('div', { style: S.cardTitle }, 'Mis Constancias'),
                  h('div', { style: S.cardSub }, 'Descarga tus documentos')
                )
              ),
              h('p', { style: S.desc }, 'Inicia sesión con tu cuenta ', h('strong', { style: { color: '#1B396A' } }, '@itdurango.edu.mx'), ' para ver y descargar tus constancias y reconocimientos.'),
              GOOGLE_CLIENT_ID === "TU_CLIENT_ID_AQUI.apps.googleusercontent.com" ?
                h('div', { style: { padding: '.85rem', background: '#fffbee', border: '1.5px solid rgba(196,154,53,.3)', borderRadius: 12, fontSize: '.78rem', color: '#7A5500' } }, h('strong', null, '⚠ Configuración pendiente: '), 'agrega el GOOGLE_CLIENT_ID.') :
                h('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', gap: '.6rem' } },
                  h('div', { id: 'googleSignInDiv', style: { width: '100%', minHeight: 44 } }),
                  error && h('div', { style: { display: 'flex', alignItems: 'center', gap: '.5rem', padding: '.7rem .9rem', background: '#fef2f2', border: '1.5px solid rgba(220,80,80,.18)', borderRadius: 10, fontSize: '.78rem', color: '#7A1E1E' } }, h(AlertIcon, { size: 14 }), ' ', error),
                  h('div', { style: S.authNote }, h(LockIcon, { size: 11 }), ' Autenticación segura con Google')
                )
            )
          ),
          
          // Tarjeta 2
          h('div', { style: { ...S.card('rgba(26,58,92,.1)'), opacity: constActivada ? 1 : 0.55, transition: 'opacity .3s' } },
            h('div', { style: S.stripe(constActivada ? 'linear-gradient(90deg,#1B396A 0%,#2B5580 35%,#C49A35 55%,#2B5580 75%,#1B396A 100%)' : 'linear-gradient(90deg,#999 0%,#bbb 50%,#999 100%)') }),
            h('div', { style: S.cardBody },
              h('div', { style: { display: 'flex', alignItems: 'center', gap: '.85rem', marginBottom: '.2rem' } },
                h('div', { style: S.iconWrap(constActivada ? 'linear-gradient(135deg,#1B396A,#2B5580)' : 'linear-gradient(135deg,#999,#bbb)', constActivada ? '0 3px 14px rgba(26,58,92,.25)' : 'none') }, 
                  constActivada ? h(AwardIcon, { size: 21, color: '#F5E4A8' }) : h(LockIcon, { size: 21, color: '#fff' })
                ),
                h('div', null,
                  h('div', { style: S.cardTitle }, 'Generar Constancia'),
                  h('div', { style: S.cardSub }, constActivada ? 'Cursos Junio–Agosto 2026' : 'Disponible próximamente')
                )
              ),
              h('p', { style: S.desc }, constActivada ? 'Genera el PDF de tu constancia o reconocimiento de los cursos de actualización docente del periodo actual.' : 'Este servicio estará disponible a partir del 29 de junio de 2026, al concluir el periodo de actualización docente.'),
              constActivada ?
                h('div', { style: { flex: 1, display: 'flex', flexDirection: 'column', gap: '.55rem' } },
                  h('div', { style: { display: 'flex', borderRadius: 12, overflow: 'hidden', border: '1.5px solid #d1d5db', background: '#fff', boxShadow: '0 1px 4px rgba(0,0,0,.06)' } },
                    h('input', { id: 'inputUsuarioConstancia', type: 'text', placeholder: 'tu.usuario', autoComplete: 'off', autoCapitalize: 'none', onKeyDown: (e) => { if (e.key === 'Enter') abrirConstancia(); }, style: { flex: 1, padding: '.72rem .9rem', border: 'none', outline: 'none', fontSize: '.88rem', fontFamily: "'DM Sans','Inter',sans-serif", color: '#1A1720', background: 'transparent' } }),
                    h('span', { style: { display: 'flex', alignItems: 'center', padding: '.72rem .75rem .72rem 0', fontSize: '.78rem', color: '#9090A0', fontFamily: "'DM Sans','Inter',sans-serif", whiteSpace: 'nowrap', userSelect: 'none' } }, '@itdurango.edu.mx')
                  ),
                  h('button', { onClick: abrirConstancia, style: { width: '100%', padding: '.82rem 1rem', background: 'linear-gradient(135deg,#1B396A,#2B5580)', color: '#F5E4A8', border: 'none', borderRadius: 12, fontFamily: "'DM Sans','Inter',sans-serif", fontWeight: 700, fontSize: '.9rem', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '.5rem', boxShadow: '0 4px 14px rgba(26,58,92,.30)' } }, h(AwardIcon, { size: 16, color: '#F5E4A8' }), ' Generar mi Constancia'),
                  h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '.35rem', fontSize: '.7rem', color: '#A0A0B0' } }, h(LockIcon, { size: 11 }), ' Acceso con tu usuario institucional')
                ) :
                h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '.5rem', padding: '.82rem 1rem', borderRadius: 12, background: '#f0f0f0', color: '#999', fontSize: '.83rem', fontWeight: 500 } }, h(ClockIcon, { size: 15, color: '#bbb' }), ' Próximamente — 29 Jun 2026')
            )
          ),
          
          // Tarjeta 3
          h('a', { href: './otras-constancias.html', style: { ...S.card('rgba(107,26,42,.1)'), cursor: 'pointer', textDecoration: 'none', transition: 'transform .2s, box-shadow .2s' }, onMouseEnter: (e) => { e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.boxShadow = '0 8px 16px rgba(0,0,0,.07),0 32px 64px rgba(107,26,42,.15)'; }, onMouseLeave: (e) => { e.currentTarget.style.transform = ''; e.currentTarget.style.boxShadow = ''; } },
            h('div', { style: S.stripe('linear-gradient(90deg,#3D0A14 0%,#6B1A2A 28%,#C49A35 50%,#6B1A2A 72%,#3D0A14 100%)') }),
            h('div', { style: S.cardBody },
              h('div', { style: { display: 'flex', alignItems: 'center', gap: '.85rem', marginBottom: '.2rem' } },
                h('div', { style: S.iconWrap('linear-gradient(135deg,#3D0A14,#922438)', '0 3px 14px rgba(107,26,42,.28)') },
                  h('svg', { xmlns: 'http://www.w3.org/2000/svg', viewBox: '0 0 38 38', width: 22, height: 22 },
                    h('path', { d: 'M19 2 L36 2 L36 28 Q27.5 36 19 31 Q10.5 36 2 28 L2 2 Z', fill: 'rgba(255,255,255,0.15)', stroke: '#F5E4A8', strokeWidth: '1.8', opacity: '0.9' }),
                    h('circle', { cx: 19, cy: 18, r: 5.5, fill: 'none', stroke: '#F5E4A8', strokeWidth: '1.5', opacity: '0.85' }),
                    h('circle', { cx: 19, cy: 18, r: 2, fill: '#F5E4A8', opacity: '0.95' }),
                    h('line', { x1: 19, y1: 6, x2: 19, y2: 29, stroke: '#F5E4A8', strokeWidth: '1', opacity: '0.4' }),
                    h('line', { x1: 5, y1: 18, x2: 33, y2: 18, stroke: '#F5E4A8', strokeWidth: '1', opacity: '0.4' })
                  )
                ),
                h('div', null,
                  h('div', { style: S.cardTitle }, 'Desarrollo Académico'),
                  h('div', { style: S.cardSub }, 'Uso Interno')
                )
              ),
              h('p', { style: S.desc }, 'Genera constancias y reconocimientos personalizados con la plantilla oficial ITD. Ingresa nombres manualmente o carga un Excel. Incluye QR de verificación.'),
              h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '.5rem', padding: '.85rem 1rem', borderRadius: 12, background: 'linear-gradient(135deg,#3D0A14,#922438)', color: '#F5E4A8', fontWeight: 700, fontSize: '.84rem', boxShadow: '0 4px 18px rgba(107,26,42,.30)' } }, '📜 Acceder')
            )
          )
        ),
        
        h('div', { style: S.footer }, '© ', new Date().getFullYear(), ' Dr. Alejandro Calderón Rentería — Coordinación Docente ITD')
      );
    };
    
    // ============================================================
    // 5. COMPONENTE DASHBOARD (SIMPLIFICADO)
    // ============================================================
    const Dashboard = ({ user, onLogout }) => {
      const [year, setYear] = useState('2025');
      const [allData, setAllData] = useState([]);
      const [search, setSearch] = useState('');
      const [loading, setLoading] = useState(false);
      
      useEffect(() => {
        setLoading(true);
        fetchLocalData(year).then(res => {
          setAllData(res.data);
          setLoading(false);
        });
      }, [year]);
      
      const filteredData = useMemo(() => {
        return allData.filter(item => {
          if (item.correo !== user.email && !user.isAdmin) return false;
          if (search) {
            const term = normalize(search);
            return normalize(item.nombre).includes(term) || normalize(item.curso).includes(term);
          }
          return true;
        });
      }, [allData, user, search]);
      
      return h('div', { className: 'min-h-screen bg-gray-50 font-sans flex flex-col' },
        h('nav', { className: 'bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm' },
          h('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8' },
            h('div', { className: 'flex justify-between h-16 items-center' },
              h('div', { className: 'flex items-center gap-3' },
                h('img', { src: LOGO_URL, className: 'h-10 w-auto', alt: 'ITD', onError: (e) => e.target.style.display = 'none' }),
                h('span', { className: 'text-base md:text-lg font-bold text-itd-blue' }, 'Constancias ITD')
              ),
              h('div', { className: 'flex items-center gap-3' },
                h('div', { className: 'hidden md:flex flex-col items-end' },
                  h('span', { className: 'text-xs font-bold text-gray-700' }, user.name || 'Usuario'),
                  h('span', { className: 'text-[10px] text-gray-500' }, user.email)
                ),
                user.isAdmin && h('span', { className: 'bg-itd-red text-white text-[10px] px-2 py-0.5 rounded font-bold' }, 'Admin'),
                h('button', { onClick: onLogout, className: 'ml-2 flex items-center gap-2 px-3 py-2 text-gray-600 hover:text-red-700 hover:bg-red-50 rounded-lg' },
                  h('span', { className: 'text-sm font-medium hidden sm:inline' }, 'Salir'),
                  h(LogOutIcon, { className: 'w-4 h-4' })
                )
              )
            )
          )
        ),
        
        h('main', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full' },
          h('div', { className: 'bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center' },
            h('div', { className: 'flex gap-4 w-full md:w-auto items-center' },
              h('span', { className: 'text-sm font-bold text-gray-500 uppercase' }, 'Año:'),
              h('select', { value: year, onChange: (e) => setYear(e.target.value), className: 'bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-itd-blue focus:border-itd-blue block w-full md:w-48 p-2.5' },
                Object.keys(DATA_SOURCES).map(k => h('option', { key: k, value: k }, k))
              )
            ),
            h('div', { className: 'relative w-full md:w-96' },
              h('div', { className: 'absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none' }, h(SearchIcon, { className: 'w-4 h-4 text-gray-400' })),
              h('input', { type: 'text', value: search, onChange: (e) => setSearch(e.target.value), className: 'bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-itd-blue focus:border-itd-blue block w-full pl-10 p-2.5', placeholder: 'Buscar...' })
            )
          ),
          
          loading ? 
            h('div', { className: 'text-center py-20' }, 'Cargando...') :
            filteredData.length === 0 ?
              h('div', { className: 'text-center py-20 bg-white rounded-xl border-2 border-dashed border-gray-200' },
                h(ShieldIcon, { className: 'mx-auto h-16 w-16 text-gray-200 mb-4' }),
                h('h3', { className: 'text-xl font-bold text-gray-900' }, 'Sin resultados'),
                h('p', { className: 'text-gray-500 mt-2' }, 'No tienes documentos disponibles.')
              ) :
              h('div', { className: 'bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden' },
                filteredData.map((item, idx) => 
                  h('div', { key: item.id, className: `grid grid-cols-1 md:grid-cols-12 gap-4 p-4 items-center ${idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-blue-50 border-b border-gray-100 last:border-0` },
                    h('div', { className: 'col-span-1 md:col-span-6' },
                      h('p', { className: 'font-bold text-gray-900' }, item.nombre),
                      h('p', { className: 'text-xs text-gray-500' }, item.correo),
                      h('p', { className: 'text-xs text-gray-400' }, item.fecha)
                    ),
                    h('div', { className: 'col-span-1 md:col-span-4' },
                      h('p', { className: 'text-sm font-medium text-gray-800' }, item.curso)
                    ),
                    h('div', { className: 'col-span-1 md:col-span-2 flex justify-end' },
                      item.link && item.link !== '#' ? 
                        h('a', { href: item.link, target: '_blank', className: 'flex items-center gap-2 px-4 py-2 bg-itd-blue hover:bg-itd-blue/80 text-white text-xs font-bold rounded-lg transition-colors' },
                          h(FileDownIcon, { className: 'w-4 h-4' }), 'Descargar'
                        ) :
                        h('span', { className: 'text-xs text-gray-400' }, 'No disponible')
                    )
                  )
                )
              )
        ),
        
        h('footer', { className: 'bg-itd-red text-white py-6 mt-auto' },
          h('div', { className: 'max-w-7xl mx-auto px-4 text-center' },
            h('p', { className: 'text-sm font-medium' }, '© ', new Date().getFullYear(), ' Dr. Alejandro Calderón Rentería')
          )
        )
      );
    };
    
    // ============================================================
    // 6. APP Y MONTAJE
    // ============================================================
    const App = () => {
      const [user, setUser] = useState(null);
      return user ? h(Dashboard, { user, onLogout: () => { window.location.href = 'https://da-itd.github.io/A/'; } }) : h(Login, { onLogin: setUser });
    };
    
    const root = createRoot(document.getElementById('root'));
    root.render(h(App, null));
    
    console.log('✅ App iniciada correctamente');
  </script>
</body>
</html>
