// Genera hash simple para contraseñas (en producción usar bcrypt vía backend)
const sha256b = async (str) => {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
};

// GENERADOR DE DATOS QR
// Formato: DA+NombreCompleto+FechaCreacion

/**
 * Construye el string de datos que se codifica en el QR.
 * Ejemplo: "DA+Juan García López+2026-03-08"
 */
const ocBuildQRData = (nombre, fechaCreacion) => {
  // fechaCreacion en formato ISO YYYY-MM-DD para estandarizar
  const fechaISO = fechaCreacion || new Date().toISOString().split('T')[0];
  return `DA+${nombre}+${fechaISO}`;
};

/**
 * Devuelve la URL de la imagen QR usando la API pública de QR Server.
 * No requiere clave de API. Tamaño 100x100px, sin márgenes.
 */
const ocGetQRUrl = (nombre, fechaCreacion) => {
  const data = ocBuildQRData(nombre, fechaCreacion);
  const encoded = encodeURIComponent(data);
  // qrserver.com — API pública, sin límite razonable de uso
  return `https://api.qrserver.com/v1/create-qr-code/?size=100x100&margin=4&data=${encoded}`;
};

const ocPrint = (html, nombre) => {
  const win = window.open('', '_blank', 'width=900,height=700');
  if (!win) { alert('Permite ventanas emergentes para imprimir.'); return; }
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(() => { win.print(); }, 600);
};

const ocDownloadPDF = async (html, nombre) => {
  // Usamos html2canvas + jsPDF (cargados vía CDN en el index.html)
  // Si no están disponibles, abrimos ventana para imprimir como PDF
  if (window.html2canvas && window.jspdf) {
    const container = document.createElement('div');
    container.innerHTML = html;
    container.style.cssText = 'position:fixed;left:-9999px;top:0;z-index:-1;';
    document.body.appendChild(container);
    const el = container.querySelector('body') || container;
    try {
      const canvas = await window.html2canvas(el, { scale: 2, useCORS: true });
      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'px', format: [794, 1123] });
      pdf.addImage(imgData, 'JPEG', 0, 0, 794, 1123);
      pdf.save(`Constancia_${nombre.replace(/\s+/g,'_')}.pdf`);
    } finally {
      document.body.removeChild(container);
    }
  } else {
    // Fallback: print dialog
    ocPrint(html, nombre);
  }
};

// ==========================================
// LEER EXCEL (xlsx via SheetJS CDN)
// ==========================================
const ocParseExcel = (file) => {
  return new Promise((resolve, reject) => {
    if (!window.XLSX) {
      reject(new Error('La librería XLSX no está disponible. Asegúrate de incluir SheetJS en tu index.html.'));
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = window.XLSX.read(e.target.result, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = window.XLSX.utils.sheet_to_json(ws, { header: 1 });
        // Detectar columna "nombre" en la primera fila
        const headers = (rows[0] || []).map(h => String(h).toLowerCase().trim());
        const nameIdx = headers.findIndex(h =>
          h.includes('nombre') || h.includes('name') || h.includes('participante') || h.includes('docente')
        );
        const emailIdx = headers.findIndex(h =>
          h.includes('correo') || h.includes('email') || h.includes('mail')
        );
        const names = [];
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length === 0) continue;
          const nombre = nameIdx >= 0 ? String(row[nameIdx] || '').trim() : String(row[0] || '').trim();
          const correo = emailIdx >= 0 ? String(row[emailIdx] || '').trim() : '';
          if (nombre) names.push({ nombre, correo });
        }
        resolve(names);
      } catch (err) {
        reject(new Error('No se pudo leer el archivo Excel: ' + err.message));
      }
    };
    reader.onerror = () => reject(new Error('Error al leer el archivo.'));
    reader.readAsArrayBuffer(file);
  });
};

      border: `1.5px solid ${colors[type]}28`,
      fontSize: 14, fontWeight: 600, maxWidth: 340,
      animation: 'slideIn .3s cubic-bezier(.22,.68,0,1.2) both',
      display: 'flex', alignItems: 'center', gap: 10
    }}>
      <span>{msg}</span>
      <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'inherit', fontSize: 16, lineHeight: 1, padding: 0 }}>×</button>
    </div>
  );
};

const OcLoginScreen = ({ onLogin }) => {
  const [email, setEmail]   = useState('');
  const [pass, setPass]     = useState('');
  const [error, setError]   = useState('');
  const [loading, setLoading] = useState(false);

  const handleSubmit = async () => {
    setError('');
    if (!email || !pass) { setError('Completa todos los campos.'); return; }
    setLoading(true);
    try {
      const emailLow = email.trim().toLowerCase();
      // Admin siempre puede entrar si fue pre-registrado o es el admin principal
      const users = ocGetU();
      const hashPass = await sha256b(pass);
      // Buscar usuario
      const found = users.find(u => u.email === emailLow && u.hash === hashPass && u.active);
      if (found) {
        const session = { email: found.email, name: found.name, isAdmin: found.isAdmin };
        ocSetSS(session);
        onLogin(session);
      } else {
        setError('Credenciales incorrectas o usuario inactivo.');
      }
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{

        background: 'radial-gradient(ellipse 70% 50% at 15% 5%,rgba(107,26,42,.08) 0%,transparent 55%), radial-gradient(ellipse 50% 40% at 85% 95%,rgba(26,58,92,.08) 0%,transparent 50%)'
      }}/>

      <div style={{ position: 'relative', width: '100%', maxWidth: 400 }}>
        {/* Logo */}
        <div style={{ textAlign: 'center', marginBottom: '2rem' }}>
          <div style={{ marginBottom: 14 }}><OcLogo size={80}/></div>
          <h1 style={{
            fontFamily: "'Playfair Display','Georgia',serif",
            fontSize: 26, fontWeight: 900, color: '#3D0A14',
            margin: '0 0 .3rem', letterSpacing: '-.01em'
          }}>Otras Constancias</h1>
          <p style={{ fontSize: 13, color: '#6B6B7B', margin: 0 }}>
            Instituto Tecnológico de Durango
          </p>
        </div>

        {/* Card de login */}
        <div style={{
          background: '#fff', borderRadius: 22,
          boxShadow: '0 4px 8px rgba(0,0,0,.04), 0 24px 52px rgba(107,26,42,.1)',

          <div style={{ height: 5, background: 'linear-gradient(90deg,#3D0A14 0%,#6B1A2A 28%,#C49A35 50%,#6B1A2A 72%,#3D0A14 100%)', backgroundSize: '200% 100%', animation: 'shimmer 4s linear infinite' }}/>

              <OcInput label="Correo electrónico" value={email} onChange={setEmail}
                placeholder="usuario@itdurango.edu.mx" type="email" required/>
              <OcInput label="Contraseña" value={pass} onChange={setPass}

              {error && (

// PANTALLA: GENERADOR DE CONSTANCIAS
// ==========================================
const OcGenerador = ({ user, toast }) => {
  const today = new Date().toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
  const [mode, setMode] = useState('manual'); // 'manual' | 'excel'
  const [form, setForm] = useState({
    tipo: 'constancia',
    descripcion: '',
    fecha: today,
    firmante: 'Dr. Alejandro Calderón Rentería',
    cargo: 'Coordinación de Actualización Docente',
  });
  const [nombre, setNombre]   = useState('');
  const [excelList, setExcelList] = useState([]);
  const [excelErr, setExcelErr]   = useState('');
  const [loading, setLoading]     = useState(false);
  const [generated, setGenerated] = useState([]); // [{nombre, correo, html, driveUrl, status}]
  const [generating, setGenerating] = useState(false);
  const fileRef = useRef();

  const buildForm = (n) => ({
    ...form,
    nombre: n
  });

  const handleExcelUpload = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setExcelErr('');
    try {
      const names = await ocParseExcel(file);
      if (names.length === 0) throw new Error('No se encontraron nombres en el archivo.');
      setExcelList(names);
      toast(`✅ ${names.length} nombres cargados del Excel`, 'success');
    } catch (err) {
      setExcelErr(err.message);
    }
    e.target.value = '';
  };

  const generarConstancias = async () => {
    const nombres = mode === 'manual'
      ? [{ nombre: nombre.trim(), correo: '' }]
      : excelList;

    if (mode === 'manual' && !nombre.trim()) {
      toast('Ingresa un nombre.', 'warn'); return;
    }
    if (mode === 'excel' && excelList.length === 0) {
      toast('Carga un archivo Excel primero.', 'warn'); return;
    }
    if (!form.descripcion.trim()) {
      toast('Ingresa la descripción de la constancia.', 'warn'); return;
    }

    setGenerating(true);
    // Fecha de creación en ISO (YYYY-MM-DD) — se incrusta en el QR
    const fechaCreacion = new Date().toISOString().split('T')[0];
    const results = [];
    for (const item of nombres) {
      const html = buildConstanciaHTML({ nombre: item.nombre, ...form, fechaCreacion });
      let driveUrl = null;
      try {
        driveUrl = await ocUpload(html, item.nombre, form.tipo);
      } catch {}
      results.push({ nombre: item.nombre, correo: item.correo, html, driveUrl, status: 'listo', fechaCreacion });
    }
    setGenerated(results);
    setGenerating(false);
    toast(`🎉 ${results.length} constancia(s) generada(s)`, 'success');
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
      {/* Header */}
      <div style={{ background: '#fff', borderRadius: 16, padding: '20px 24px', boxShadow: '0 1px 4px rgba(0,0,0,.06)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
        <div>
          <h2 style={{ margin: 0, fontSize: 20, fontWeight: 800, color: '#1a1a2e' }}>Generar Constancias</h2>
          <p style={{ margin: '2px 0 0', fontSize: 13, color: '#888' }}>Crea constancias en PDF con la plantilla oficial ITD</p>
        </div>
        <OcBadge color="#1B396A">📄 PDF Oficial</OcBadge>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'minmax(320px,1fr) minmax(280px,420px)', gap: 20, alignItems: 'start' }}>
        {/* Formulario */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          {/* Tipo y modo */}
          <div style={{ background: '#fff', borderRadius: 16, padding: 20, boxShadow: '0 1px 4px rgba(0,0,0,.06)' }}>
            <h3 style={{ margin: '0 0 16px', fontSize: 15, fontWeight: 700, color: '#333' }}>⚙️ Configuración</h3>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              <OcSelect label="Tipo de documento" value={form.tipo}
                onChange={v => setForm(f => ({ ...f, tipo: v }))}
                options={[
                  { value: 'constancia', label: '📜 Constancia' },
                  { value: 'reconocimiento', label: '🏅 Reconocimiento' },
                ]}/>
              <OcInput label="Descripción / Actividad" value={form.descripcion}
                onChange={v => setForm(f => ({ ...f, descripcion: v }))}
                placeholder="Ej: Participación en el Congreso ITD 2026" required/>
              <OcInput label="Fecha de expedición" value={form.fecha}
                onChange={v => setForm(f => ({ ...f, fecha: v }))}
                placeholder="Ej: 8 de marzo de 2026"/>
              <OcInput label="Firmante" value={form.firmante}
                onChange={v => setForm(f => ({ ...f, firmante: v }))}
                placeholder="Nombre del firmante"/>
              <OcInput label="Cargo del firmante" value={form.cargo}
                onChange={v => setForm(f => ({ ...f, cargo: v }))}
                placeholder="Cargo institucional"/>
            </div>
          </div>

          {/* Modo de nombres */}
          <div style={{ background: '#fff', borderRadius: 16, padding: 20, boxShadow: '0 1px 4px rgba(0,0,0,.06)' }}>
            <h3 style={{ margin: '0 0 14px', fontSize: 15, fontWeight: 700, color: '#333' }}>👤 Destinatario(s)</h3>

                  color: mode === t.key ? '#F5E4A8' : '#555',
                  transition: 'all .15s'
                }}>{t.label}</button>
              ))}
            </div>

            {mode === 'manual' ? (
              <OcInput label="Nombre completo" value={nombre} onChange={setNombre}
                placeholder="Ej: Lic. Juan García López" required/>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                <p style={{ margin: 0, fontSize: 13, color: '#666', lineHeight: 1.6 }}>
                  Sube un archivo <strong>.xlsx</strong> o <strong>.xls</strong>. La primera fila debe tener encabezados; se detecta automáticamente la columna <em>"Nombre"</em> (también acepta "Participante", "Docente"). Opcionalmente incluye columna <em>"Correo"</em>.
                </p>
                <input type="file" accept=".xlsx,.xls" ref={fileRef} onChange={handleExcelUpload} style={{ display: 'none' }}/>
                <OcBtn onClick={() => fileRef.current?.click()} variant="ghost">
                  📂 Seleccionar archivo Excel
                </OcBtn>
                {excelErr && <p style={{ margin: 0, fontSize: 12, color: '#c00' }}>⚠ {excelErr}</p>}
                {excelList.length > 0 && (
                  <div style={{ background: '#f0fdf4', borderRadius: 10, padding: '10px 14px', border: '1px solid #86efac' }}>
                    <strong style={{ fontSize: 13, color: '#14532d' }}>✅ {excelList.length} nombre(s) cargados</strong>
                    <div style={{ maxHeight: 120, overflowY: 'auto', marginTop: 8, display: 'flex', flexDirection: 'column', gap: 3 }}>

          <OcBtn onClick={generarConstancias} disabled={generating} style={{ justifyContent: 'center' }}>

        </div>

        {/* Vista previa y resultados */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16, position: 'sticky', top: 80 }}>
          {/* Vista previa mínima */}
          <div style={{ background: '#fff', borderRadius: 16, padding: 20, boxShadow: '0 1px 4px rgba(0,0,0,.06)' }}>
            <h3 style={{ margin: '0 0 14px', fontSize: 15, fontWeight: 700, color: '#333' }}>👁 Vista Previa</h3>
            <div style={{
              background: 'linear-gradient(135deg,#f8f4ec,#efe7d5)',
              borderRadius: 12, padding: 20, textAlign: 'center',
              border: '2px solid #e8d5b0', position: 'relative', overflow: 'hidden'
            }}>
              <div style={{ position: 'absolute', top: 8, left: 8, right: 8, bottom: 8, border: '1px solid #C49A3540', borderRadius: 8, pointerEvents: 'none' }}/>
              <div style={{ fontSize: 10, letterSpacing: '.2em', color: '#8B1A2A', textTransform: 'uppercase', fontWeight: 700, marginBottom: 6 }}>Otorga la presente</div>
              <div style={{ fontFamily: "'Playfair Display',serif", fontSize: 28, fontWeight: 700, color: '#3D0A14', marginBottom: 10 }}>
                {form.tipo === 'reconocimiento' ? 'Reconocimiento' : 'Constancia'}
              </div>
              <div style={{ fontSize: 11, color: '#666', marginBottom: 6 }}>a</div>
              <div style={{ fontFamily: "'Playfair Display',serif", fontStyle: 'italic', fontSize: 16, color: '#1B396A', fontWeight: 700, borderBottom: '1px solid #C49A35', paddingBottom: 6, marginBottom: 8 }}>

const OcAdminUsers = ({ currentAdmin, toast }) => {
  const [users, setUsers] = useState(getUsers);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ name: '', email: '', password: '', isAdmin: false });
  const [formErr, setFormErr] = useState('');
  const [saving, setSaving] = useState(false);

  const refresh = () => setUsers(ocGetU());

  const handleCreate = async () => {
    setFormErr('');
    if (!form.name.trim() || !form.email.trim() || !form.password.trim()) {
      setFormErr('Todos los campos son requeridos.'); return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) {
      setFormErr('Correo inválido.'); return;
    }
    const existing = ocGetU();
    if (existing.find(u => u.email === form.email.toLowerCase())) {
      setFormErr('Ya existe un usuario con ese correo.'); return;
    }
    setSaving(true);
    const hash = await sha256b(form.password);
    const newUser = {
      id: Date.now().toString(),
      name: form.name.trim(),
      email: form.email.trim().toLowerCase(),
      hash,
      isAdmin: form.isAdmin,
      active: true,
      createdAt: new Date().toISOString()
    };
    const updated = [...existing, newUser];
    ocSetU(updated);
    setUsers(updated);
    setForm({ name: '', email: '', password: '', isAdmin: false });
    setShowForm(false);
    setSaving(false);
    toast(`✅ Usuario ${newUser.email} creado`, 'success');
  };

  const toggleActive = (id) => {
    const updated = ocGetU().map(u => u.id === id ? { ...u, active: !u.active } : u);
    ocSetU(updated);
    setUsers(updated);
    toast('Estado del usuario actualizado', 'info');
  };

  const deleteUser = (id) => {
    const u = ocGetU().find(x => x.id === id);
    if (!u) return;
    if (!window.confirm(`¿Eliminar usuario ${u.email}? Esta acción no se puede deshacer.`)) return;
    const updated = ocGetU().filter(x => x.id !== id);
    ocSetU(updated);
    setUsers(updated);
    toast('Usuario eliminado', 'info');
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
      {/* Header */}
      <div style={{ background: '#fff', borderRadius: 16, padding: '20px 24px', boxShadow: '0 1px 4px rgba(0,0,0,.06)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 12 }}>
        <div>
          <h2 style={{ margin: 0, fontSize: 20, fontWeight: 800, color: '#1a1a2e' }}>Gestión de Usuarios</h2>
          <p style={{ margin: '2px 0 0', fontSize: 13, color: '#888' }}>{users.length} usuario(s) registrado(s)</p>
        </div>
        <OcBtn onClick={() => setShowForm(v => !v)} variant={showForm ? 'ghost' : 'primary'}>
          {showForm ? '✕ Cancelar' : '+ Nuevo Usuario'}
        </OcBtn>
      </div>

      {/* Formulario nuevo usuario */}
      {showForm && (
        <div style={{ background: '#fff', borderRadius: 16, padding: 24, boxShadow: '0 1px 4px rgba(0,0,0,.06)', border: '2px solid #1B396A22' }}>
          <h3 style={{ margin: '0 0 18px', fontSize: 16, fontWeight: 700, color: '#1B396A' }}>➕ Crear nuevo usuario</h3>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: 14 }}>
            <OcInput label="Nombre completo" value={form.name} onChange={v => setForm(f => ({ ...f, name: v }))} placeholder="Nombre Apellido" required/>
            <OcInput label="Correo electrónico" value={form.email} onChange={v => setForm(f => ({ ...f, email: v }))} placeholder="usuario@itdurango.edu.mx" type="email" required/>
            <OcInput label="Contraseña inicial" value={form.password} onChange={v => setForm(f => ({ ...f, password: v }))} placeholder="Mínimo 6 caracteres" type="password" required/>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
              <label style={{ fontSize: 12, fontWeight: 700, color: '#444', letterSpacing: '.03em', textTransform: 'uppercase' }}>Rol</label>
              <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', padding: '10px 14px', borderRadius: 10, border: '1.5px solid #e0e0e0', fontSize: 14 }}>
                <input type="checkbox" checked={form.isAdmin} onChange={e => setForm(f => ({ ...f, isAdmin: e.target.checked }))}/>
                Administrador
              </label>
            </div>
          </div>
          {formErr && <p style={{ margin: '12px 0 0', fontSize: 13, color: '#c00' }}>⚠ {formErr}</p>}
          <div style={{ marginTop: 16, display: 'flex', gap: 10 }}>
            <OcBtn onClick={handleCreate} disabled={saving}>

// ==========================================
// LÓGICA DE DATOS
// ==========================================

const detectDelimiter = (text) => {
    if (!text) return ',';
    const firstLine = text.split('\n')[0] || '';
    const commas = (firstLine.match(/,/g) || []).length;
    const semicolons = (firstLine.match(/;/g) || []).length;
    return semicolons > commas ? ';' : ',';
};

const parseCSV = (text) => {
  if (!text) return [];
  const delimiter = detectDelimiter(text);
  const rows = [];
  let currentRow = [];
  let currentField = '';
  let inQuotes = false;
  
  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    if (char === '"' && text[i+1] === '"') { currentField += '"'; i++; }
    else if (char === '"') { inQuotes = !inQuotes; }
    else if (char === delimiter && !inQuotes) { currentRow.push(currentField); currentField = ''; }
    else if ((char === '\r' || char === '\n') && !inQuotes) {
      if (char === '\r' && text[i+1] === '\n') i++;
      currentRow.push(currentField); rows.push(currentRow); currentRow = []; currentField = '';
    } else { currentField += char; }
  }
  if (currentField || currentRow.length > 0) { currentRow.push(currentField); rows.push(currentRow); }
  return rows;
};

const normalize = (str) => str ? str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() : "";

const fetchLocalData = async (year) => {
  const fileUrl = DATA_SOURCES[year];
  if (!fileUrl) return { data: [], error: null, headersFound: [] };
  
  try {
    const response = await fetch(fileUrl);
    if (!response.ok) {
         if (response.status === 404) throw new Error(`El archivo "db_${year}.csv" no se encuentra en el repositorio.`);
         throw new Error(`Error al cargar el archivo local (${response.status})`);
    }
    const text = await response.text();
    if (!text || text.trim().length === 0) throw new Error("El archivo CSV está vacío.");

    const rows = parseCSV(text);
    if (rows.length < 2) return { data: [], error: "El archivo CSV no tiene datos suficientes.", headersFound: [] };

    const rawHeaders = rows[0];
    const headers = rawHeaders.map(h => normalize(h));
    const findCol = (keywords) => headers.findIndex(h => keywords.some(k => h.includes(normalize(k))));

    const idx = {
        nombre: findCol(['nombre', 'participante', 'docente', 'alumno', 'name']),
        correo: findCol(['emailaddress', 'correo', 'email', 'mail', 'e-mail']),
        curso:  findCol(['codigo', 'curso', 'taller', 'reconocimiento', 'concepto', 'actividad', 'clave', 'code']),
        fecha:  findCol(['año', 'fecha', 'periodo', 'year', 'date']),
        status: findCol(['status', 'estatus', 'estado']),
        link:   findCol(['fileattachments', 'link', 'url', 'pdf', 'descarga', 'archivo', 'constancia'])
    };

    if (idx.correo === -1) {
        return { 
            data: [], 
            error: `No se encontró la columna de Correo (buscamos: EmailAddress, Correo, Email). Encabezados detectados: ${rawHeaders.join(', ')}`,
            headersFound: rawHeaders
        };
    }

    const cleanData = rows.slice(1).map((r, i) => {
        if (r.length <= 1 && !r[0]) return null;
        const statusRaw = idx.status !== -1 ? (r[idx.status] || 'PENDIENTE') : 'ENVIADO';
        return {
            id:     i,
            nombre: idx.nombre !== -1 ? r[idx.nombre] : 'Usuario ITD',
            correo: (r[idx.correo] || '').trim().toLowerCase(),
            curso:  idx.curso !== -1 ? r[idx.curso] : 'Documento ITD',
            fecha:  idx.fecha !== -1 ? r[idx.fecha] : year,
            status: statusRaw.toUpperCase().trim(),
            link:   idx.link !== -1 ? r[idx.link] : '',
            year:   year
        };
    }).filter(item => item && item.correo);

    return { data: cleanData, error: null, headersFound: rawHeaders };
  } catch (error) {
    console.error("Error Fetch Local:", error);
    return { data: [], error: error.message, headersFound: [] };
  }
};

// ==========================================
// AUTH UTILS (GOOGLE JWT DECODER)
// ==========================================
const decodeJwtResponse = (token) => {
    try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    } catch (e) {
        console.error("Error decoding JWT", e);
        return null;
    }
};

const useCountdown = (targetDate) => {
  const calc = () => {
    const diff = targetDate - new Date();
    if (diff <= 0) return { dias: 0, horas: 0, minutos: 0, segundos: 0, abierto: true };
    return {
      dias:     Math.floor(diff / (1000 * 60 * 60 * 24)),
      horas:    Math.floor((diff / (1000 * 60 * 60)) % 24),
      minutos:  Math.floor((diff / (1000 * 60)) % 60),
      segundos: Math.floor((diff / 1000) % 60),
      abierto:  false
    };
  };
  const [tiempo, setTiempo] = useState(calc);
  useEffect(() => {
    const t = setInterval(() => setTiempo(calc()), 1000);
    return () => clearInterval(t);
  }, []);
  return tiempo;
};

const Dashboard = ({ user, onLogout }) => {
  const [year, setYear] = useState('2025');
  const [allData, setAllData] = useState([]);
  const [headers, setHeaders] = useState([]);
  const [errorStr, setErrorStr] = useState(null);
  const [search, setSearch] = useState('');
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    if (!DATA_SOURCES[year]) { setAllData([]); return; }
    setLoading(true);
    setErrorStr(null);
    fetchLocalData(year).then(res => {
        setAllData(res.data);
        setHeaders(res.headersFound);
        if (res.error) setErrorStr(res.error);
        setLoading(false);
    });
  }, [year]);

  const filteredData = useMemo(() => {
    if (errorStr || allData.length === 0) return [];
    return allData.filter(item => {
        const isOwner    = item.correo === user.email;
        const isStatusOk = item.status === 'ENVIADO';
        if (!user.isAdmin && !(isOwner && isStatusOk)) return false;
        if (!user.isAdmin && !item.correo.includes('@')) return false;
        if (search) {
            const term = normalize(search);
            return (
                normalize(item.nombre).includes(term) ||
                normalize(item.curso).includes(term)  ||
                normalize(item.correo).includes(term)
            );
        }
        return true;
    });
  }, [allData, user, search, errorStr]);

  const downloadReport = () => {
    if (!filteredData.length) return;
    const csvContent = "data:text/csv;charset=utf-8,"
        + "Nombre,Correo,Documento,Fecha,Status,Link\n"
        + filteredData.map(e => `"${e.nombre}","${e.correo}","${e.curso}","${e.fecha}","${e.status}","${e.link}"`).join("\n");
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `reporte_itd_${year}.csv`);
    document.body.appendChild(link);
    link.click();
  };

  const handleShareEmail = (item) => {
      const subject = `Documento ITD: ${item.curso}`;
      const body = `Hola ${item.nombre},\n\nAdjunto encontrarás el enlace para descargar tu documento: "${item.curso}".\n\nEnlace de descarga: ${item.link}\n\nAtentamente,\nCoordinación de Actualización Docente\nDesarrollo Académico`;
      window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  };

  const handleDownloadClick = (item) => {
      console.log(`[Analytics] Descarga iniciada: ${item.curso} por ${user.email}`);
  };

  return (
    <div className="min-h-screen bg-gray-50 font-sans flex flex-col">
      <nav className="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex justify-between h-16 items-center">
                <div className="flex items-center gap-3">
                    <img src={LOGO_URL} className="h-10 w-auto" alt="ITD" onError={(e) => e.target.style.display='none'}/>
                    <div className="h-8 w-px bg-gray-300 hidden sm:block mx-1"></div>
                    <div className="flex flex-col">
                        <span className="text-base md:text-lg font-bold text-itd-blue leading-tight">
                            Descarga de Constancias y Reconocimientos
                        </span>
                    </div>
                </div>
                <div className="flex items-center gap-3">
                    {user.picture ? (
                        <img src={user.picture} alt="Profile" className="w-8 h-8 rounded-full border border-gray-200" />
                    ) : (
                        <div className="w-8 h-8 rounded-full bg-itd-blue text-white flex items-center justify-center text-xs font-bold">
                            {user.email.charAt(0).toUpperCase()}
                        </div>
                    )}
                    <div className="hidden md:flex flex-col items-end">
                         <span className="text-xs font-bold text-gray-700">{user.name || 'Usuario'}</span>
                         <span className="text-[10px] text-gray-500">{user.email}</span>
                    </div>
                    {user.isAdmin && <span className="bg-itd-red text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase ml-2">Admin</span>}
                    <button 
                        onClick={onLogout} 
                        className="ml-2 flex items-center gap-2 px-3 py-2 text-gray-600 hover:text-red-700 hover:bg-red-50 rounded-lg transition-colors border border-transparent hover:border-red-100" 
                        title="Salir"
                    >
                        <span className="text-sm font-medium hidden sm:inline">Salir</span>
                        <span>↩</span>
                    </button>
                </div>
            </div>
        </div>
      </nav>

      <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        
        {/* Filtros */}
        <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div className="flex gap-4 w-full md:w-auto items-center">
                <span className="text-sm font-bold text-gray-500 uppercase">Año:</span>
                <select value={year} onChange={(e) => setYear(e.target.value)} className="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-itd-blue focus:border-itd-blue block w-full md:w-48 p-2.5">

            </div>
            <div className="relative w-full md:w-96">
                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><span>🔍</span></div>
                <input 
                    type="text" value={search} onChange={(e) => setSearch(e.target.value)}
                    className="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-itd-blue focus:border-itd-blue block w-full pl-10 p-2.5" 
                    placeholder="Buscar por nombre, correo o documento..." 
                />
            </div>
            {user.isAdmin && (
                <button onClick={downloadReport} className="flex items-center gap-2 px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-sm font-medium rounded-lg transition-colors shadow-sm">
                    <span>⬇️</span> Reporte
                </button>
            )}
        </div>

        {/* Error de lectura */}
        {errorStr && (
            <div className="bg-red-50 border-l-4 border-red-500 p-6 rounded-r-xl shadow-sm mb-8 animate-pulse">
                <div className="flex items-start">
                    <span>⚠️</span>
                    <div>
                        <h3 className="text-lg font-bold text-red-800 mb-2">Error de lectura</h3>
                        <p className="text-red-700 font-medium mb-3">{errorStr}</p>
                        <div className="mt-3 text-sm text-red-800 bg-white/50 p-3 rounded">
                            <strong>Ayuda:</strong>
                            <p className="mt-1">Revisa que el archivo <code>db_{year}.csv</code> esté en GitHub. Las columnas soportadas son: EmailAddress, FileAttachments, Codigo, Nombre, etc.</p>
                        </div>
                    </div>
                </div>
            </div>
        )}

        {/* Lista de documentos */}
        {loading ? (
            <div className="flex flex-col items-center justify-center py-20 bg-white rounded-xl border border-gray-100">
                <div className="animate-spin rounded-full h-10 w-10 border-4 border-itd-blue border-t-transparent mb-4"></div>

            </div>
        ) : filteredData.length > 0 ? (
            <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div className="hidden md:grid grid-cols-12 gap-4 p-4 border-b bg-gray-50 text-xs font-medium text-gray-500 uppercase tracking-wider">
                    <div className="col-span-4">Nombre / Correo</div>
                    <div className="col-span-5">Documento</div>
                    <div className="col-span-3 text-right">Acciones</div>
                </div>
                <div>
                    {filteredData.map((item, index) => (
                        <div key={item.id} className={`grid grid-cols-1 md:grid-cols-12 gap-4 p-4 items-center transition-colors group ${index % 2 === 0 ? 'bg-white' : 'bg-red-50'} hover:bg-blue-50`}>
                            <div className="col-span-1 md:col-span-4 flex items-start gap-3">
                                <div className={`flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold mt-1 ${index % 2 === 0 ? 'bg-blue-100 text-itd-blue' : 'bg-white text-itd-red border border-red-100'}`}>
                                    {item.nombre.charAt(0)}
                                </div>
                                <div className="min-w-0 flex-1">
                                    <p className="font-bold text-gray-900 text-sm truncate">{item.nombre}</p>
                                    <p className="text-xs text-gray-500 truncate">{item.correo}</p>
                                    <div className="md:hidden flex items-center gap-1 mt-1 text-[10px] text-gray-400">
                                        <span>📅</span> {item.fecha}
                                    </div>
                                </div>
                            </div>
                            <div className="col-span-1 md:col-span-5">
                                <div className="flex items-start gap-2">
                                     {user.isAdmin && (
                                        <div className="mt-1">
                                            {item.status === 'ENVIADO' ? 
                                                <span>✅</span> : 
                                                <div className="w-3 h-3 rounded-full bg-yellow-400"></div>
                                            }
                                        </div>
                                     )}
                                     <div>
                                        <h3 className="text-sm font-medium text-gray-800 leading-snug">{item.curso}</h3>
                                        <p className="hidden md:flex items-center gap-1 text-xs text-gray-400 mt-1">
                                            <span>📅</span> {item.fecha}
                                        </p>
                                     </div>
                                </div>
                            </div>
                            <div className="col-span-1 md:col-span-3 flex justify-start md:justify-end gap-2">
                                {item.link && item.link !== '#' && item.status === 'ENVIADO' ? (
                                    <>
                                        <button 
                                            onClick={() => handleShareEmail(item)}
                                            className="p-2 text-gray-500 hover:text-itd-blue hover:bg-blue-100 rounded-lg transition-colors"
                                            title="Enviar enlace por correo"
                                        >
                                            <span>✉️</span>
                                        </button>
                                        <a 
                                            href={item.link} target="_blank"
                                            onClick={() => handleDownloadClick(item)}
                                            className="w-full md:w-auto flex items-center justify-center gap-2 px-4 py-2 bg-white border border-gray-200 hover:border-itd-blue hover:text-itd-blue text-gray-600 text-xs font-bold rounded-lg transition-all shadow-sm group-hover:shadow-md"
                                        >
                                            <span>📥</span> 
                                            <span>Descargar</span>
                                        </a>
                                    </>
                                ) : (
                                    <span className="text-xs text-gray-400 italic px-4 py-2 bg-gray-50 rounded border border-gray-100 w-full md:w-auto text-center">
                                        {item.status !== 'ENVIADO' ? 'No Aprobado, Revisar con su instructor' : 'No disponible'}
                                    </span>
                                )}
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        ) : !loading && !errorStr && (
            <div className="text-center py-20 bg-white rounded-xl border-2 border-dashed border-gray-200">
                <span>🛡️</span>
                <h3 className="text-xl font-bold text-gray-900">Sin resultados</h3>
                <p className="text-gray-500 mt-2 max-w-sm mx-auto">
                    {search ? 'No encontramos coincidencias para tu búsqueda.' : 'No tienes documentos disponibles con estatus "ENVIADO" para este año.'}
                </p>
                {user.isAdmin && (
                   <div className="mt-6 inline-block px-4 py-2 bg-yellow-50 border border-yellow-200 rounded text-xs text-yellow-800 text-left">
                        <strong>Diagnóstico Admin:</strong><br/>
                        Leyendo archivo: <code>db_{year}.csv</code><br/>
                        Asegúrate que el archivo esté subido en GitHub en la carpeta raíz.
                   </div>
                )}
            </div>
        )}



      </main>

      <footer className="bg-itd-red text-white py-6 mt-auto">
        <div className="max-w-7xl mx-auto px-4 text-center">
            <p className="text-sm font-medium">© {new Date().getFullYear()} Dr. Alejandro Calderón Rentería - Coordinación Docente</p>
        </div>
      </footer>
    </div>
  );
};

const App = () => {
  const [view, setView] = useState('portal');
  const [user, setUser] = useState(null);
  const handleLogin = (u) => {
    if (u && u._goto === 'otras-constancias') { setView('otras-constancias'); return; }
    setUser(u); setView('dashboard');
  };
  const handleLogout = () => { setUser(null); setView('portal'); window.location.href = "https://da-itd.github.io/A/"; };
  if (view === 'otras-constancias') return <OtrasConstanciasApp onBack={() => setView('portal')}/>;
  if (view === 'dashboard' && user) return <Dashboard user={user} onLogout={handleLogout}/>;
  return <Login onLogin={handleLogin}/>;
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

  </script>
</body>
</html>
