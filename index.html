    const GENERAR_CONSTANCIA_URL = "https://script.google.com/macros/s/AKfycbxRpN34MVIg3XVJYfV80WOzNilDpVJEMSw9RuMc7PI49zH1Wl-z2Si8hLxCzOMiJaQSpA/exec";

    const FECHA_APERTURA = new Date('2026-06-29T00:00:00');
    
    // ============================================================

      h('polyline', { points: "14 2 14 8 20 8" }),
      h('line', { x1: "16", y1: "13", x2: "8", y2: "13" }),
      h('line', { x1: "16", y1: "17", x2: "8", y2: "17" }),
      h('polyline', { points: "10 9 9 9 8 9" })
    ]);
    
    // ============================================================
    // 4. HOOK: CUENTA REGRESIVA
    // ============================================================
    const useCountdown = (targetDate) => {
      const calcular = () => {
        const ahora = new Date();
        const diff = targetDate - ahora;
        if (diff <= 0) return { dias: 0, horas: 0, minutos: 0, segundos: 0, abierto: true };
        return {
          dias: Math.floor(diff / (1000 * 60 * 60 * 24)),
          horas: Math.floor((diff / (1000 * 60 * 60)) % 24),
          minutos: Math.floor((diff / (1000 * 60)) % 60),
          segundos: Math.floor((diff / 1000) % 60),
          abierto: false
        };
      };
      
      const [tiempo, setTiempo] = useState(calcular);
      
      useEffect(() => {
        const intervalo = setInterval(() => setTiempo(calcular()), 1000);
        return () => clearInterval(intervalo);
      }, [targetDate]);
      
      return tiempo;
    };
    
    // ============================================================
    // 5. UTILIDADES - LECTURA DE GOOGLE SHEETS
    // ============================================================
    const normalize = (str) => str ? str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim() : "";
    
    const parseCSVLine = (line) => {
      const result = [];
      let current = '';
      let inQuotes = false;
      
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          if (inQuotes && line[i + 1] === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result;
    };
    
    const cleanCSVValue = (val) => {
      let cleaned = val.trim();
      if (cleaned.startsWith('"') && cleaned.endsWith('"')) {
        cleaned = cleaned.substring(1, cleaned.length - 1).replace(/""/g, '"');
      }
      return cleaned;
    };
    
    const decodeJwtResponse = (token) => {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        return JSON.parse(jsonPayload);
      } catch(e) { return null; }
    };
    
    // ============================================================
    // 6. FUNCIÓN PARA OBTENER CONSTANCIAS
    // ============================================================
    const getConstancias = async (year) => {
      try {
        const response = await fetch(`${CONSTANCIAS_CSV_URL}&_=${Date.now()}`);
        if (!response.ok) throw new Error('Error al cargar constancias');
        
        const csvText = await response.text();
        const lines = csvText.trim().split(/\r?\n/);
        
        if (lines.length < 2) return [];
        
        const headers = parseCSVLine(lines[0]);
        const findCol = (keywords) => headers.findIndex(h => keywords.some(k => normalize(h).includes(normalize(k))));
        
        const idx = {
          nombre: findCol(['nombre', 'participante', 'docente', 'alumno', 'name']),
          correo: findCol(['emailaddress', 'correo', 'email', 'mail', 'e-mail']),
          curso: findCol(['codigo', 'curso', 'taller', 'reconocimiento', 'concepto', 'actividad', 'clave', 'code']),
          fecha: findCol(['año', 'fecha', 'periodo', 'year', 'date']),
          status: findCol(['status', 'estatus', 'estado']),
          link: findCol(['fileattachments', 'link', 'url', 'pdf', 'descarga', 'archivo', 'constancia'])
        };
        
        if (idx.correo === -1) {
          console.error('No se encontró la columna de correo. Encabezados:', headers);
          return [];
        }
        
        const data = lines.slice(1)
          .filter(line => line.trim())
          .map(line => {
            const values = parseCSVLine(line);
            if (values.length < 2) return null;
            
            const fechaRaw = idx.fecha !== -1 ? cleanCSVValue(values[idx.fecha]) : '';
            const fechaNormalizada = fechaRaw.replace(/\s*-\s*/g, '').trim();
            
            return {
              id: Math.random().toString(36).substr(2, 9),
              nombre: idx.nombre !== -1 ? cleanCSVValue(values[idx.nombre]) : 'Usuario ITD',
              correo: cleanCSVValue(values[idx.correo]).toLowerCase(),
              curso: idx.curso !== -1 ? cleanCSVValue(values[idx.curso]) : 'Documento ITD',
              fecha: fechaRaw || year,
              fechaNormalizada: fechaNormalizada,
              status: idx.status !== -1 ? cleanCSVValue(values[idx.status]).toUpperCase().trim() : 'ENVIADO',
              link: idx.link !== -1 ? cleanCSVValue(values[idx.link]) : '',
              year: year
            };
          })
          .filter(item => item && item.correo);
        
        if (year) {
          return data.filter(item => {
            const yearMatch = item.fecha.match(/\d{4}/);
            const itemYear = yearMatch ? yearMatch[0] : '';
            return itemYear === year || item.fechaNormalizada === year;
          });
        }
        
        return data;
      } catch (error) {
        console.error("Error al obtener constancias:", error);
        return [];
      }
    };
    
    // ============================================================
    // 7. COMPONENTE LOGIN
    // ============================================================
    const Login = ({ onLogin }) => {
      const [error, setError] = useState('');
      const [logoError, setLogoError] = useState(false);
      const [showModal, setShowModal] = useState(false);
      const [adminPass, setAdminPass] = useState('');
      const [adminError, setAdminError] = useState('');
      const [constActivada, setConstActivada] = useState(() => {
        try { return localStorage.getItem('constActivada') === 'true'; } catch(e) { return false; }
      });
      const googleIntencion = useRef('login');
      
      // Cuenta regresiva
      const countdown = useCountdown(FECHA_APERTURA);
      
      // Determinar si la tarjeta debe estar activa
      const estaActiva = constActivada || countdown.abierto;
      
      const abrirConstancia = () => {
        const input = document.getElementById('inputUsuarioConstancia');
        const prefijo = (input ? input.value : '').replace(/@.*$/, '').trim().toLowerCase();
        if (!prefijo) { 
          if (input) { input.style.border = '1.5px solid #e05050'; setTimeout(() => { input.style.border = ''; }, 1500); }
          return; 
        }
        window.location.href = GENERAR_CONSTANCIA_URL + '?email=' + encodeURIComponent(prefijo + '@itdurango.edu.mx');
      };
      
      const handleAdminToggle = () => {
        if (adminPass !== ADMIN_PASSWORD) { setAdminError('Clave incorrecta.'); return; }
        const nuevo = !constActivada;
        setConstActivada(nuevo);
        try { localStorage.setItem('constActivada', String(nuevo)); } catch(e) {}
        setShowModal(false);
        setAdminPass('');
        setAdminError('');
      };
      
      const handleCredentialResponse = (response) => {
        const payload = decodeJwtResponse(response.credential);
        if (!payload || !payload.email) { setError('No se pudo verificar la identidad.'); return; }
        const email = payload.email.toLowerCase();
        if (googleIntencion.current === 'constancia') {
          googleIntencion.current = 'login';
          if (!email.endsWith('@itdurango.edu.mx')) {
            setError('Usa tu cuenta @itdurango.edu.mx');
            setTimeout(() => setError(''), 4000);
            return;
          }
          window.location.href = GENERAR_CONSTANCIA_URL + '?email=' + encodeURIComponent(email);
        } else {
          const isAdmin = ADMIN_EMAILS.includes(email);
          onLogin({ email, name: payload.name, picture: payload.picture, isAdmin });
        }
      };
      
      useEffect(() => {
        if (window.google && GOOGLE_CLIENT_ID !== "TU_CLIENT_ID_AQUI.apps.googleusercontent.com") {
          try {
            window.google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleCredentialResponse });

              document.getElementById("googleSignInDiv"),
              { theme: "outline", size: "large", width: "100%", text: "continue_with" }
            );
          } catch(err) {
            setError("Error al cargar servicios de Google.");
          }
        }
      }, []);
      
      const S = {
        page: { minHeight: '100vh', background: 'linear-gradient(150deg, #f8f4ec 0%, #efe7d5 45%, #e8f0f8 100%)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '2rem 1rem', fontFamily: "'DM Sans','Inter',sans-serif", position: 'relative', overflow: 'hidden' },
        bgDeco: { position: 'absolute', inset: 0, pointerEvents: 'none', background: 'radial-gradient(ellipse 70% 50% at 15% 5%, rgba(107,26,42,.08) 0%, transparent 55%), radial-gradient(ellipse 50% 40% at 85% 95%, rgba(26,58,92,.08) 0%, transparent 50%)' },
        header: { textAlign: 'center', marginBottom: '2rem', position: 'relative', animation: 'fadeUp .5s cubic-bezier(.22,.68,0,1.2) both' },
        logoWrap: { position: 'relative', width: 84, height: 84, margin: '0 auto 1rem' },
        logoRing: { position: 'absolute', inset: -8, borderRadius: '50%', border: '1.5px solid rgba(196,154,53,.5)', animation: 'ringPulse 2.8s ease-out infinite' },
        logoRing2: { position: 'absolute', inset: -8, borderRadius: '50%', border: '1.5px solid rgba(196,154,53,.3)', animation: 'ringPulse 2.8s 1.4s ease-out infinite' },
        logoImg: { width: '100%', height: '100%', objectFit: 'contain', borderRadius: '50%', background: '#fff', padding: 8, boxShadow: '0 4px 22px rgba(107,26,42,.2), 0 0 0 2.5px rgba(196,154,53,.65)' },
        h1: { fontFamily: "'Playfair Display','Georgia',serif", fontSize: 'clamp(1.55rem,5vw,2.1rem)', fontWeight: 900, color: '#3D0A14', margin: '0 0 .35rem', letterSpacing: '-.015em', lineHeight: 1.15 },
        sub: { fontSize: '.83rem', color: '#6B6B7B', margin: 0 },
        grid: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(288px, 1fr))', gap: '1.1rem', width: '100%', maxWidth: 760, animation: 'fadeUp .55s .1s cubic-bezier(.22,.68,0,1.2) both' },
        card: (accent) => ({ background: '#fff', borderRadius: 22, overflow: 'hidden', boxShadow: `0 4px 8px rgba(0,0,0,.04), 0 24px 52px ${accent}, 0 0 0 1px rgba(196,154,53,.12)`, display: 'flex', flexDirection: 'column' }),
        stripe: (g) => ({ height: 5, backgroundSize: '200% 100%', animation: 'shimmer 4s linear infinite', background: g }),
        cardBody: { padding: '1.7rem 1.9rem', flex: 1, display: 'flex', flexDirection: 'column' },
        iconWrap: (bg, shadow) => ({ width: 46, height: 46, borderRadius: 13, flexShrink: 0, background: bg, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: shadow }),
        cardTitle: { fontWeight: 700, fontSize: '1.02rem', color: '#1A1720', lineHeight: 1.2 },
        cardSub: { fontSize: '.74rem', color: '#6B6B7B', marginTop: '.08rem' },
        desc: { fontSize: '.82rem', color: '#5A5A6A', lineHeight: 1.62, margin: '1rem 0 1.2rem' },
        authNote: { display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '.35rem', fontSize: '.7rem', color: '#A0A0B0', marginTop: '.5rem' },
        footer: { marginTop: '1.8rem', textAlign: 'center', fontSize: '.68rem', color: 'rgba(80,65,55,.55)', animation: 'fadeUp .5s .3s ease both', letterSpacing: '.02em' }
      };
      
      return h('div', { style: S.page },
        h('div', { style: S.bgDeco }),
        
        // Modal
        showModal && h('div', { style: { position: 'fixed', inset: 0, zIndex: 1000, background: 'rgba(0,0,0,.45)', backdropFilter: 'blur(4px)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '1rem' }, onClick: (e) => { if (e.target === e.currentTarget) { setShowModal(false); setAdminPass(''); setAdminError(''); } } },
          h('div', { style: { background: '#fff', borderRadius: 18, overflow: 'hidden', width: '100%', maxWidth: 320, boxShadow: '0 24px 60px rgba(0,0,0,.25)', animation: 'fadeUp .3s cubic-bezier(.22,.68,0,1.2) both' } },
            h('div', { style: { height: 4, background: 'linear-gradient(90deg,#3D0A14,#6B1A2A,#C49A35,#6B1A2A,#3D0A14)', backgroundSize: '200% 100%', animation: 'shimmer 3s linear infinite' } }),
            h('div', { style: { padding: '1.5rem 1.7rem' } },
              h('div', { style: { textAlign: 'center', marginBottom: '1.1rem' } },
                h('div', { style: { fontSize: '1.7rem', marginBottom: '.3rem' } }, constActivada ? '🔒' : '✅'),
                h('div', { style: { fontFamily: "'Playfair Display',serif", fontWeight: 700, fontSize: '1.05rem', color: '#3D0A14' } }, constActivada ? 'Desactivar Tarjeta 2' : 'Activar Tarjeta 2'),
                h('div', { style: { fontSize: '.73rem', color: '#9090A0', marginTop: '.2rem' } }, 'Ingresa la clave de administrador')
              ),
              h('input', { type: 'password', value: adminPass, onChange: (e) => { setAdminPass(e.target.value); setAdminError(''); }, onKeyDown: (e) => e.key === 'Enter' && handleAdminToggle(), placeholder: '••••••••', autoFocus: true, style: { width: '100%', padding: '.72rem 1rem', border: `1.5px solid ${adminError ? '#e05050' : '#e0e0e0'}`, borderRadius: 10, fontSize: '.9rem', fontFamily: "'DM Sans',sans-serif", outline: 'none', marginBottom: '.5rem', boxSizing: 'border-box', background: adminError ? '#fff5f5' : '#fff' } }),

    const Dashboard = ({ user, onLogout }) => {

      const [error, setError] = useState(null);
      
      const YEARS = ['2024', '2025', '2026'];
      
      useEffect(() => {
        const fetchData = async () => {
          setLoading(true);
          setError(null);
          try {
            const data = await getConstancias(year);
            setAllData(data);
            if (data.length === 0) {
              setError('No se encontraron constancias para el año ' + year);
            }
          } catch (err) {
            console.error("Error al cargar datos:", err);
            setError('Error al cargar los datos. Verifica la conexión.');
          } finally {
            setLoading(false);
          }
        };
        fetchData();
      }, [year]);
      
      const filteredData = useMemo(() => {
        if (allData.length === 0) return [];
        return allData.filter(item => {
          if (user.isAdmin) return true;
          const isOwner = item.correo === user.email;
          const isStatusOk = item.status === 'ENVIADO';
          return isOwner && isStatusOk;
        });
      }, [allData, user]);
      
      const searchFiltered = useMemo(() => {
        if (!search) return filteredData;
        const term = normalize(search);
        return filteredData.filter(item => 
          normalize(item.nombre).includes(term) ||
          normalize(item.curso).includes(term) ||
          normalize(item.correo).includes(term)
        );
      }, [filteredData, search]);
      
      const downloadReport = () => {
        if (!searchFiltered.length) return;
        const csvContent = "data:text/csv;charset=utf-8,"
          + "Nombre,Correo,Documento,Fecha,Status,Link\n"
          + searchFiltered.map(e => `"${e.nombre}","${e.correo}","${e.curso}","${e.fecha}","${e.status}","${e.link}"`).join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `constancias_${year}.csv`);
        document.body.appendChild(link);
        link.click();
      };
      
      const handleShareEmail = (item) => {
        const subject = `Constancia: ${item.curso}`;
        const body = `Hola ${item.nombre},\n\nAdjunto encontrarás el enlace para descargar tu constancia: "${item.curso}".\n\nEnlace de descarga: ${item.link}\n\nAtentamente,\nCoordinación de Actualización Docente\nInstituto Tecnológico de Durango`;
        window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      };

                            title: "Enviar enlace por correo"
                          },
                            h(MailIcon, { className: 'w-5 h-5' })
                          ),
                          h('a', { 
                            href: item.link, 
                            target: '_blank',
                            className: 'w-full md:w-auto flex items-center justify-center gap-2 px-4 py-2 bg-white border border-gray-200 hover:border-itd-blue hover:text-itd-blue text-gray-600 text-xs font-bold rounded-lg transition-all shadow-sm group-hover:shadow-md'
                          },
                            h(FileDownIcon, { className: 'w-4 h-4' }), 
                            h('span', null, 'Descargar')
                          )
                        )
                      ) : (
                        h('span', { className: 'text-xs text-gray-400 italic px-4 py-2 bg-gray-50 rounded border border-gray-100 w-full md:w-auto text-center' },
                          item.status !== 'ENVIADO' ? 'No Aprobado, Revisar con su instructor' : 'No disponible'
                        )
                      )
                    )
                  )
                )
              )
            ),
          
          !loading && !error && searchFiltered.length === 0 && 
            h('div', { className: 'text-center py-20 bg-white rounded-xl border-2 border-dashed border-gray-200' },
              h(ShieldIcon, { className: 'mx-auto h-16 w-16 text-gray-200 mb-4' }),
              h('h3', { className: 'text-xl font-bold text-gray-900' }, 'Sin resultados'),
              h('p', { className: 'text-gray-500 mt-2 max-w-sm mx-auto' },
                search ? 'No encontramos coincidencias para tu búsqueda.' : 
                (user.isAdmin ? 'No hay constancias registradas para este año.' : 'No tienes constancias disponibles con estatus "ENVIADO" para este año.')
              ),
              user.isAdmin && h('div', { className: 'mt-6 inline-block px-4 py-2 bg-yellow-50 border border-yellow-200 rounded text-xs text-yellow-800 text-left' },
                h('strong', null, 'Diagnóstico Admin:'), h('br', null),
                'Leyendo constancias del año ', year, h('br', null),
                'Total de registros: ', allData.length
              )
            )
        ),
        
        h('footer', { className: 'bg-itd-red text-white py-6 mt-auto' },
          h('div', { className: 'max-w-7xl mx-auto px-4 text-center' },
            h('p', { className: 'text-sm font-medium' }, '© ', new Date().getFullYear(), ' Dr. Alejandro Calderón Rentería - Coordinación Docente')
          )
        )
      );
    };
    
    // ============================================================
    // 9. APP Y MONTAJE
    // ============================================================
    const App = () => {
      const [user, setUser] = useState(null);
      return user ? h(Dashboard, { user, onLogout: () => { window.location.href = 'https://da-itd.github.io/A/'; } }) : h(Login, { onLogin: setUser });
    };
    
    const root = createRoot(document.getElementById('root'));
    root.render(h(App, null));
    
    console.log('✅ App iniciada - Tarjeta "Generar Constancia" completamente restaurada');
  </script>
</body>
</html>
