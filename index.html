<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portal ITD — Constancias y Reconocimientos</title>
  <meta name="description" content="Portal de constancias, reconocimientos y documentos del Instituto Tecnológico de Durango"/>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'itd-blue': '#1B396A',
            'itd-red':  '#8B1A2A',
            'itd-gold': '#C49A35',
          }
        }
      }
    }
  </script>

  <!-- Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- SheetJS (para leer Excel en Otras Constancias) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- html2canvas + jsPDF (para generar PDF en Otras Constancias) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body { margin: 0; font-family: 'DM Sans', 'Inter', sans-serif; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    @keyframes fadeUp  { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
    @keyframes ringPulse { 0%,100%{transform:scale(1);opacity:.6} 50%{transform:scale(1.12);opacity:0} }
    @keyframes spin    { to{transform:rotate(360deg)} }
    @keyframes slideIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel (transpila JSX en el browser; en producción usa bundler) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- ============================================================
       MÓDULO: OTRAS CONSTANCIAS
       Archivo externo — debe estar en el mismo directorio del repo
       ============================================================ -->
  <script type="text/babel" data-type="module" src="./otras-constancias.js"></script>

  <!-- ============================================================
       MAIN — Carga condicional:
       Si ?app=constancias → renderiza OtrasConstanciasRoot
       Si no → renderiza el portal principal con todas las tarjetas
       ============================================================ -->
  <script type="text/babel">
    // Detectar si hay un parámetro de app en la URL
    // ?app=constancias redirige al módulo de otras constancias
    // Esto permite que el botón de la tarjeta cambie el view sin recargar la página
  </script>

  <!-- MAIN PRINCIPAL (basado en tu main-4.js + nueva tarjeta) -->
  <script type="text/babel" src="./main-4.js"></script>
</body>
</html>
