    <script>
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbxMyVFB5HXwxhRCzJBvKczI5GVmzk4Y_3kFNpcOOjxqHZmkVwJH77BJZID6K3WgoAd8_w/exec";
      const FOLDER_ID = "1jFRMOdEYD2us53DheYRYvdec19wycH_k";
      const ADM_EMAIL = "alejandro.calderon@itdurango.edu.mx";

      // 🔑 CONTRASEÑA MAESTRA FIJA (siempre funciona, cámbiala si quieres)
      const MASTER_PWD = "ITD-Admin-2026";

      document.getElementById("yr").textContent = new Date().getFullYear();

      let CU = null,
        XL = [],
        mode = "manual",
        GEN = [];
      let calibMode = null,
        calibScale = 1,
        pdfPageW = 0,
        pdfPageH = 0,
        pdfBase64 = "";
      let coords = {
        nombre: { set: false },
        qr: { set: false },
        concepto: { set: false },
        fecha: { set: false },
      };

      // ── Contraseña diaria (invitados) ─────────────────────────────────
      const PWD_DEFAULT_PARTS = ["DD", "OC", "YYYY"];
      let pwdParts = [];

      function loadPwdConfig() {
        try {
          const raw = localStorage.getItem("itd_pwd_cfg");
          if (raw) {
            const obj = JSON.parse(raw);
            if (Array.isArray(obj.parts) && obj.parts.length) {
              pwdParts = obj.parts;
              return;
            }
          }
        } catch (e) {}
        pwdParts = [...PWD_DEFAULT_PARTS];
        try {
          localStorage.setItem("itd_pwd_cfg", JSON.stringify({ parts: pwdParts }));
        } catch (e) {}
      }

      function savePwdConfig() {
        if (!pwdParts.length) {
          toast("⚠ Agrega al menos una parte a la contraseña", "warn");
          return;
        }
        try {
          localStorage.setItem("itd_pwd_cfg", JSON.stringify({ parts: pwdParts }));
        } catch (e) {}
        toast("✅ Contraseña diaria guardada", "success");
        renderPwdParts();
        updatePwdPreview();
      }

      function resetPwdConfig() {
        if (!confirm("¿Restablecer la contraseña diaria a DD+OC+YYYY?")) return;
        pwdParts = [...PWD_DEFAULT_PARTS];
        try {
          localStorage.setItem("itd_pwd_cfg", JSON.stringify({ parts: pwdParts }));
        } catch (e) {}
        renderPwdParts();
        updatePwdPreview();
        toast("↺ Contraseña restablecida", "info");
      }

      function addPwdToken(tok) {
        pwdParts.push(tok);
        renderPwdParts();
        updatePwdPreview();
      }

      function addPwdCustom() {
        const el = document.getElementById("pwd-custom-txt");
        const t = (el.value || "").trim();
        if (!t) {
          toast("Escribe un texto para agregar", "warn");
          return;
        }
        pwdParts.push("TXT:" + t);
        el.value = "";
        renderPwdParts();
        updatePwdPreview();
      }

      function removePwdPart(idx) {
        pwdParts.splice(idx, 1);
        renderPwdParts();
        updatePwdPreview();
      }

      function renderPwdParts() {
        const box = document.getElementById("pwd-parts");
        if (!box) return;
        if (!pwdParts.length) {
          box.innerHTML =
            '<span style="color:var(--t3); font-size:12px; padding:4px 8px">Sin partes — agrega tokens arriba</span>';
          return;
        }
        box.innerHTML = pwdParts
          .map((p, i) => {
            const label = p.startsWith("TXT:") ? `"${p.slice(4)}"` : p;
            return `<span class="token-pill">${label}<button class="rm" title="Quitar" onclick="removePwdPart(${i})">×</button></span>`;
          })
          .join("");
      }

      function getPwdForDate(d = new Date()) {
        const DD = String(d.getDate()).padStart(2, "0");
        const D = String(d.getDate());
        const MM = String(d.getMonth() + 1).padStart(2, "0");
        const M = String(d.getMonth() + 1);
        const YYYY = String(d.getFullYear());
        const YY = YYYY.slice(-2);
        return pwdParts
          .map((p) => {
            if (typeof p !== "string") return "";
            if (p.startsWith("TXT:")) return p.slice(4);
            switch (p) {
              case "DD": return DD;
              case "D":  return D;
              case "MM": return MM;
              case "M":  return M;
              case "YYYY": return YYYY;
              case "YY": return YY;
              case "OC": return "oc";
              case "ABC": return "ABC";
              case "ITD": return "ITD";
              default: return p;
            }
          })
          .join("");
      }

      // Contraseña del administrador = YYYY + 8 + DD  (ej. 2026805)
      function getAdminPwdForDate(d = new Date()) {
        const YYYY = String(d.getFullYear());
        const DD = String(d.getDate()).padStart(2, "0");
        return `${YYYY}8${DD}`;
      }

      function updatePwdPreview() {
        const el = document.getElementById("pwd-preview");
        if (el) {
          try { el.textContent = getPwdForDate(new Date()); }
          catch (e) { el.textContent = "—"; }
        }
        const admEl = document.getElementById("pwd-admin-preview");
        if (admEl) {
          try { admEl.textContent = getAdminPwdForDate(new Date()); }
          catch (e) { admEl.textContent = "—"; }
        }
      }

      // Fecha con hora local
      const isoToday = () => {
        const d = new Date();
        return d
          .toLocaleString("es-MX", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          })
          .replace(/[\/,\s:]/g, "_");
      };

      const getDisplayDate = () => {
        const d = new Date();
        const dateParts = d.toLocaleDateString("es-MX", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });
        const timeParts = d.toLocaleTimeString("es-MX", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: true,
        });
        return `${dateParts} - ${timeParts}`;
      };

      const qrData = (n, f) => `DA ${n} ${f || isoToday()}`;
      const qrUrl = (n, f) =>
        `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=2&data=${encodeURIComponent(qrData(n, f))}`;

      /* ═══ PLANTILLAS (LocalStorage) ════════════════════════════════════════ */
      function getPlantillas() {
        try {
          return JSON.parse(localStorage.getItem("itd_tpls")) || [];
        } catch {
          return [];
        }
      }
      function guardarPlantilla() {
        const nombreEvento = document.getElementById("f-evento-nombre").value.trim();
        if (!nombreEvento || !pdfBase64) return;
        const tpls = getPlantillas();
        const tpl = {
          nombre: nombreEvento,
          pdfBase64, pdfPageW, pdfPageH, coords,
          fontFamily: document.getElementById("f-fontfamily").value,
          fontSize: document.getElementById("f-fontsize").value,
          fontColor: document.getElementById("f-fontcolor").value,
          italic: document.getElementById("f-italic").checked,
          bold: document.getElementById("f-bold").checked,
          cFontFamily: document.getElementById("f-concepto-fontfamily")?.value || "Georgia, serif",
          cFontSize: document.getElementById("f-concepto-fontsize")?.value || "44",
          cFontColor: document.getElementById("f-concepto-fontcolor")?.value || "#1a1a1a",
          cItalic: document.getElementById("f-concepto-italic")?.checked ?? true,
          cBold: document.getElementById("f-concepto-bold")?.checked ?? false,
          fFontFamily: document.getElementById("f-fecha-fontfamily")?.value || "Georgia, serif",
          fFontSize: document.getElementById("f-fecha-fontsize")?.value || "32",
          fFontColor: document.getElementById("f-fecha-fontcolor")?.value || "#1a1a1a",
          fItalic: document.getElementById("f-fecha-italic")?.checked ?? false,
          fBold: document.getElementById("f-fecha-bold")?.checked ?? false,
          qrOn: document.getElementById("f-qr-on").checked,
          conceptoOn: document.getElementById("f-concepto-on").checked,
          conceptoTxt: document.getElementById("f-concepto-txt").value,
          fechaOn: document.getElementById("f-fecha-on").checked,
          fechaTxt: document.getElementById("f-fecha-txt").value,
          lastUsed: Date.now()
        };
        const idx = tpls.findIndex(t => t.nombre.toLowerCase() === nombreEvento.toLowerCase());
        if (idx >= 0) tpls[idx] = tpl;
        else tpls.push(tpl);
        try { localStorage.setItem("itd_tpls", JSON.stringify(tpls)); } catch(e) {}
        renderTpls(nombreEvento);
      }
      function renderTpls(selectedName = "") {
        const tpls = getPlantillas().sort((a,b) => b.lastUsed - a.lastUsed);
        const sel = document.getElementById("f-evento");
        if(!sel) return;
        sel.innerHTML = '<option value="">— Nueva —</option>' + 
          tpls.map(t => `<option value="${t.nombre}" ${t.nombre===selectedName?'selected':''}>${t.nombre}</option>`).join('');
      }
      async function cargarEvento() {
        const sel = document.getElementById("f-evento");
        if(sel.value === "") {
          document.getElementById("f-evento-nombre").value = "";
          pdfBase64 = ""; pdfPageW = 0; pdfPageH = 0;
          coords = { nombre: { set: false }, qr: { set: false }, concepto: { set: false }, fecha: { set: false } };
          document.getElementById("pdf-ok").classList.add("hidden");
          const canvas = document.getElementById("calib-canvas");
          canvas.getContext("2d").clearRect(0,0, canvas.width, canvas.height);
          document.getElementById("calib-placeholder").style.display = "flex";
          updateMkRects();
          updateStepper();
          return;
        }
        const tpl = getPlantillas().find(t => t.nombre === sel.value);
        if(!tpl) return;
        document.getElementById("f-evento-nombre").value = tpl.nombre;
        pdfBase64 = tpl.pdfBase64; pdfPageW = tpl.pdfPageW; pdfPageH = tpl.pdfPageH;
        coords = tpl.coords;
        document.getElementById("f-fontfamily").value = tpl.fontFamily || "Georgia, serif";
        document.getElementById("f-fontsize").value = tpl.fontSize || "60";
        document.getElementById("f-fontcolor").value = tpl.fontColor || "#1a1a1a";
        document.getElementById("f-italic").checked = !!tpl.italic;
        document.getElementById("f-bold").checked = tpl.bold !== false;
        
        if (document.getElementById("f-concepto-fontfamily")) {
          document.getElementById("f-concepto-fontfamily").value = tpl.cFontFamily || "Georgia, serif";
          document.getElementById("f-concepto-fontsize").value = tpl.cFontSize || "44";
          document.getElementById("f-concepto-fontcolor").value = tpl.cFontColor || "#1a1a1a";
          document.getElementById("f-concepto-italic").checked = tpl.cItalic !== false;
          document.getElementById("f-concepto-bold").checked = !!tpl.cBold;
        }

        if (document.getElementById("f-fecha-fontfamily")) {
          document.getElementById("f-fecha-fontfamily").value = tpl.fFontFamily || "Georgia, serif";
          document.getElementById("f-fecha-fontsize").value = tpl.fFontSize || "32";
          document.getElementById("f-fecha-fontcolor").value = tpl.fFontColor || "#1a1a1a";
          document.getElementById("f-fecha-italic").checked = !!tpl.fItalic;
          document.getElementById("f-fecha-bold").checked = !!tpl.fBold;
        }
        
        document.getElementById("f-qr-on").checked = !!tpl.qrOn;
        document.getElementById("f-concepto-on").checked = !!tpl.conceptoOn;
        if(tpl.conceptoTxt) document.getElementById("f-concepto-txt").value = tpl.conceptoTxt;

        document.getElementById("f-fecha-on").checked = !!tpl.fechaOn;
        if(tpl.fechaTxt) document.getElementById("f-fecha-txt").value = tpl.fechaTxt;
        
        const okBadge = document.getElementById("pdf-ok");
        if(okBadge) {
          okBadge.textContent = "✅ Plantilla cargada desde Drive/Local";
          okBadge.classList.remove("hidden");
        }
        
        renderPDFCanvas(pdfBase64);
        updateStepper();
        toast("Plantilla cargada", "info");
      }

      function updateStepper() {
        const s1done = !!(
          pdfBase64 && document.getElementById("f-evento-nombre").value.trim()
        );
        const s2done = !!(mode === "excel"
          ? XL.length > 0
          : document.getElementById("f-nom").value.trim());
        const s3done =
          (!document.getElementById("f-concepto-on").checked || coords.concepto.set) &&
          (!document.getElementById("f-fecha-on").checked || coords.fecha.set);
        const s4done = !!coords.nombre.set;
        const s5ready = s1done && s2done && s3done && s4done;
        const s5done = GEN.length > 0;

        [
          { id: "st-1", card: "sc-1", done: s1done, active: !s1done },
          { id: "st-2", card: "sc-2", done: s2done, active: s1done && !s2done },
          { id: "st-3", card: "sc-3", done: s3done, active: s1done && s2done && !s3done },
          { id: "st-4", card: "sc-4", done: s4done, active: s1done && s2done && s3done && !s4done },
          { id: "st-5", card: "sc-5", done: s5done, active: s5ready && !s5done },
        ].forEach((s) => {
          document.getElementById(s.id).className =
            "step-item" + (s.done ? " done" : s.active ? " active" : "");
          document.getElementById(s.card).className =
            "step-card" + (s.done ? " done-step" : s.active ? " active-step" : "");
        });
      }

      function showTab(t) {
        document.getElementById("tab-generar").classList.toggle("hidden", t !== "generar");
        document.getElementById("tab-usuarios").classList.toggle("hidden", t !== "usuarios");

        const btnGen = document.getElementById("tab-gen-btn");
        const btnUsr = document.getElementById("tab-usr-btn");
        if (btnGen) btnGen.classList.toggle("active", t === "generar");
        if (btnUsr) btnUsr.classList.toggle("active", t === "usuarios");

        if (t === "usuarios") {
          renderPwdParts();
          updatePwdPreview();
        }
      }

      function setMode(m) {
        mode = m;
        document.getElementById("pnl-manual").classList.toggle("hidden", m !== "manual");
        document.getElementById("pnl-excel").classList.toggle("hidden", m !== "excel");
        updateStepper();
      }

      function cargarPDF(inp) {
        const file = inp.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          pdfBase64 = e.target.result.split(",")[1];
          document.getElementById("pdf-ok").textContent = "✅ " + file.name;
          document.getElementById("pdf-ok").classList.remove("hidden");
          renderPDFCanvas(pdfBase64);
          updateStepper();
        };
        reader.readAsDataURL(file);
      }

      async function abrirDrivePicker() {
        const btn = document.getElementById("btn-drive-picker");
        btn.disabled = true;
        btn.textContent = "⏳ Cargando…";
        try {
          const resp = await fetch(`${SCRIPT_URL}?action=listPDFs&folderId=${FOLDER_ID}`);
          const data = await resp.json();
          if (!data.ok) throw new Error(data.error || "Error listando archivos");
          btn.disabled = false;
          btn.textContent = "☁ Drive";
          if (!data.files || data.files.length === 0) {
            alert("No hay PDFs en la carpeta de Drive");
            return;
          }
          mostrarModalDrive(data.files);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = "☁ Drive";
          alert("⚠ " + err.message);
          console.error(err);
        }
      }

      function mostrarModalDrive(files) {
        document.getElementById("drive-modal")?.remove();
        const modal = document.createElement("div");
        modal.id = "drive-modal";
        modal.style.cssText = `position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px`;
        const box = document.createElement("div");
        box.style.cssText = `background:#fff;border-radius:16px;width:100%;max-width:420px;max-height:70vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.25);overflow:hidden`;
        box.innerHTML = `
    <div style="padding:16px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center">
      <span style="font-weight:800;font-size:15px;color:#1B396A">☁ Plantillas en Drive</span>
      <button onclick="document.getElementById('drive-modal').remove()"
        style="background:none;border:none;font-size:20px;cursor:pointer;color:#888;line-height:1">×</button>
    </div>
    <div style="overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px">
      ${files.map((f) => `
        <button onclick="seleccionarPDFDrive('${f.id}','${f.name.replace(/'/g, "\\'")}')"
          style="text-align:left;padding:10px 14px;border:1.5px solid #e0e0e0;border-radius:10px;
                 background:#fff;cursor:pointer;font-size:13px;font-family:inherit;
                 transition:background .15s;display:flex;align-items:center;gap:10px"
          onmouseover="this.style.background='#f0f4ff'" onmouseout="this.style.background='#fff'">
          <span style="font-size:18px">📄</span>
          <span style="font-weight:600;color:#1B396A">${f.name}</span>
        </button>`).join("")}
    </div>`;
        modal.appendChild(box);
        modal.addEventListener("click", (e) => { if (e.target === modal) modal.remove(); });
        document.body.appendChild(modal);
      }

      async function seleccionarPDFDrive(fileId, fileName) {
        document.getElementById("drive-modal")?.remove();
        const okEl = document.getElementById("pdf-ok");
        okEl.textContent = "⏳ Descargando " + fileName + "…";
        okEl.classList.remove("hidden");
        try {
          const resp = await fetch(`${SCRIPT_URL}?action=downloadPDF&fileId=${fileId}`);
          const data = await resp.json();
          if (!data.ok) throw new Error(data.error || "Error descargando");
          pdfBase64 = data.pdfBase64;
          okEl.textContent = "✅ ☁ " + fileName;
          renderPDFCanvas(pdfBase64);
          updateStepper();
        } catch (err) {
          okEl.textContent = "⚠ Error al descargar";
          alert("⚠ " + err.message);
          console.error(err);
        }
      }

      function updateMkRects() {
        const cv = document.getElementById("calib-canvas");
        const cRect = cv.getBoundingClientRect();
        if (!cRect.width) return;
        const s = cRect.width / cv.width;
        const cs = calibScale * s;
        const r = document.getElementById("calib-wrap").getBoundingClientRect();
        const ox = cRect.left - r.left;
        const oy = cRect.top - r.top;
        ["nombre", "qr", "concepto", "fecha"].forEach((m) => {
          const el = document.getElementById("mk-" + m + "-rect");
          const lbl = document.getElementById("pos-" + m + "-lbl");
          if (coords[m] && coords[m].set) {
            const x = coords[m].x * cs + ox;
            const y = coords[m].y * cs + oy;
            const w = coords[m].w * cs;
            const h = coords[m].h * cs;
            el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;display:block`;
            if(lbl) lbl.textContent = `✅ Set`;
          } else {
            el.style.display = "none";
            if(lbl) lbl.textContent = `Sin definir`;
          }
        });
      }

      async function renderPDFCanvas(b64) {
        if (!window.pdfjsLib)
          await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
        const page = await pdf.getPage(1);
        const vp = page.getViewport({ scale: 1.5 });
        pdfPageW = page.getViewport({ scale: 1 }).width;
        pdfPageH = page.getViewport({ scale: 1 }).height;
        const canvas = document.getElementById("calib-canvas");
        canvas.width = vp.width;
        canvas.height = vp.height;
        calibScale = 1.5;
        document.getElementById("calib-placeholder").style.display = "none";
        await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
        updateMkRects();
      }

      window.addEventListener("resize", () => {
        if (pdfBase64 && document.getElementById("calib-canvas").width) updateMkRects();
      });

      function setCalibMode(m) {
        calibMode = m;
        const wrap = document.getElementById("calib-wrap");
        wrap.classList.add("calibrando");
        wrap.style.cursor = "crosshair";
        let startX, startY;
        const mdown = (e) => {
          const r = wrap.getBoundingClientRect();
          startX = e.clientX - r.left;
          startY = e.clientY - r.top;
          document.getElementById("overlay-" + m).style.cssText =
            `left:${startX}px;top:${startY}px;width:0;height:0;display:block`;
        };
        const mmov = (e) => {
          if (startX === undefined) return;
          const r = wrap.getBoundingClientRect();
          const w = Math.abs(e.clientX - r.left - startX),
            h = Math.abs(e.clientY - r.top - startY);
          const x = Math.min(e.clientX - r.left, startX),
            y = Math.min(e.clientY - r.top, startY);
          const ov = document.getElementById("overlay-" + m);
          ov.style.left = x + "px";
          ov.style.top = y + "px";
          ov.style.width = w + "px";
          ov.style.height = h + "px";
        };
        const mup = (e) => {
          if (startX === undefined) return;
          const r = wrap.getBoundingClientRect();
          const w = Math.abs(e.clientX - r.left - startX),
            h = Math.abs(e.clientY - r.top - startY);
          const x = Math.min(e.clientX - r.left, startX),
            y = Math.min(e.clientY - r.top, startY);
          document.getElementById("overlay-" + m).style.display = "none";
          startX = undefined;
          if (w > 10 && h > 10) {
            const cRect = document.getElementById("calib-canvas").getBoundingClientRect();
            const ox = cRect.left - r.left,
              oy = cRect.top - r.top;
            const ds = document.getElementById("calib-canvas").width / cRect.width;
            coords[m] = {
              x: ((x - ox) * ds) / calibScale,
              y: ((y - oy) * ds) / calibScale,
              w: (w * ds) / calibScale,
              h: (h * ds) / calibScale,
              set: true,
            };
            document.getElementById("mk-" + m + "-rect").style.cssText =
              `left:${x}px;top:${y}px;width:${w}px;height:${h}px;display:block`;
            document.getElementById("pos-" + m + "-lbl").textContent = `✅ Set`;
            wrap.classList.remove("calibrando");
            wrap.style.cursor = "";
            wrap.removeEventListener("mousedown", mdown);
            wrap.removeEventListener("mousemove", mmov);
            wrap.removeEventListener("mouseup", mup);
            updateStepper();
          }
        };
        wrap.addEventListener("mousedown", mdown);
        wrap.addEventListener("mousemove", mmov);
        wrap.addEventListener("mouseup", mup);
      }

      function loadExcel(inp) {
        const file = inp.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const wb = XLSX.read(e.target.result, { type: "array" });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
          XL = rows
            .slice(1)
            .map((r) => ({ nombre: r[0] || "", correo: r[1] || "" }))
            .filter((x) => x.nombre);
          document.getElementById("xl-cnt").textContent = `✅ ${XL.length} nombres`;
          document.getElementById("xl-ok").classList.remove("hidden");
          updateStepper();

      async function generar() {
        if (!pdfBase64 || !coords.nombre.set) return;
        let noms = mode === "manual"
          ? [{ nombre: document.getElementById("f-nom").value }]
          : XL;
        if (noms.length === 0) {
          toast("⚠ Ingresa el nombre del destinatario.", "warn");
          return;
        }
        const btn = document.getElementById("gen-btn");
        if (btn) {
          btn.disabled = true;
          btn.innerHTML = '<div class="spinner"></div> Generando...';
        }
        GEN = [];
        document.getElementById("res-list").innerHTML = "⏳ Generando...";
        document.getElementById("res-card").classList.remove("hidden");
        const fc = isoToday();
        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
        if (!window.jspdf)
          await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
        for (let i = 0; i < noms.length; i++) {
          try {
            const pdfBytes = await superponerNombreQR(noms[i].nombre, fc);
            GEN.push({
              nombre: noms[i].nombre,
              fc,
              blobUrl: URL.createObjectURL(new Blob([pdfBytes], { type: "application/pdf" })),
              pdfBytes,
            });
            subirADriveSilencioso(noms[i].nombre, pdfBytes, fc);
          } catch (e) {
            console.error(e);
          }
        }
        renderResults();
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = "🚀 Generar Constancia(s)";
          btn.style.background = "linear-gradient(135deg, #0f7a4a, #15a05f)";
          btn.style.boxShadow = "0 4px 18px rgba(15,122,74,.35)";
        }
        const okCount = GEN.filter((g) => g.blobUrl).length;
        if (okCount === noms.length) toast(`🎉 ${okCount} constancia(s) generada(s)`, "success");
        else toast(`⚠ ${okCount}/${noms.length} generadas`, "warn");
        guardarPlantilla();
      }

      async function subirADriveSilencioso(nombre, pdfBytes, fecha) {
        try {
          const uint8 = new Uint8Array(pdfBytes);
          let bin = "";
          const CHUNK = 8192;
          for (let i = 0; i < uint8.length; i += CHUNK) {
            bin += String.fromCharCode(...uint8.subarray(i, i + CHUNK));
          }
          const base64Data = btoa(bin);
          const eventoNombre = document.getElementById("f-evento-nombre").value.trim() || "Constancias";
          const filename = `Constancia_${nombre.replace(/\s+/g, "_")}_${fecha}.pdf`;
          const payload = {
            action: "uploadPDF",
            filename: filename,
            nombreEvento: eventoNombre,
            folderId: FOLDER_ID,
            pdfBase64: base64Data,
          };
          fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) })
            .catch((e) => console.error("Error al subir a drive", e));
        } catch (e) {
          console.error("Error subiendo a drive:", e);
        }
      }

      async function superponerNombreQR(nombre, fecha) {
        const binary = atob(pdfBase64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
        const page = await pdf.getPage(1);
        const canvas = document.createElement("canvas");
        canvas.width = pdfPageW * 2;
        canvas.height = pdfPageH * 2;
        await page.render({
          canvasContext: canvas.getContext("2d"),
          viewport: page.getViewport({ scale: 2 }),
        }).promise;
        const ctx = canvas.getContext("2d");

        function drawTextInRect(ctx, text, font, color, rx, ry, rw, rh) {
          if (!text) return;
          ctx.save();
          ctx.fillStyle = color;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          let fs = parseFloat((font.match(/(\d+(?:\.\d+)?)px/) || [0, 12])[1]);
          const baseFont = font;
          const setFont = (s) => { ctx.font = baseFont.replace(/(\d+(?:\.\d+)?)px/, s + "px"); };
          setFont(fs);
          const wrapLines = () => {
            const words = text.split(" "), lines = [];
            let cur = "";
            for (const w of words) {
              const test = cur ? cur + " " + w : w;
              if (ctx.measureText(test).width > rw * 0.97 && cur) {
                lines.push(cur); cur = w;
              } else { cur = test; }
            }
            if (cur) lines.push(cur);
            return lines;
          };
          let lines = wrapLines();
          while (fs > 7 && lines.length * fs * 1.35 > rh * 0.95) {
            fs = Math.max(7, fs - 1); setFont(fs); lines = wrapLines();
          }
          const lineH = Math.round(fs * 1.35);
          const startY = ry + (rh - lines.length * lineH) / 2 + lineH / 2;
          lines.forEach((line, i) => ctx.fillText(line, rx + rw / 2, startY + i * lineH));
          ctx.restore();
        }

        const fontColor = document.getElementById("f-fontcolor")?.value || "#111";
        const fontFamily = document.getElementById("f-fontfamily")?.value || "Georgia, serif";
        const isItalic = document.getElementById("f-italic")?.checked;
        const isBold = document.getElementById("f-bold")?.checked;
        const fontSizePt = parseFloat(document.getElementById("f-fontsize")?.value || "60");
        const fs = fontSizePt * 2;
        const nombreFont = `${isBold ? "bold " : ""}${isItalic ? "italic " : ""}${fs}px ${fontFamily}`;
        drawTextInRect(ctx, nombre, nombreFont, fontColor,
          coords.nombre.x * 2, coords.nombre.y * 2, coords.nombre.w * 2, coords.nombre.h * 2);

        if (document.getElementById("f-concepto-on").checked && coords.concepto.set) {
          const cFontColor = document.getElementById("f-concepto-fontcolor")?.value || "#1a1a1a";
          const cFontFamily = document.getElementById("f-concepto-fontfamily")?.value || "Georgia, serif";
          const cIsItalic = document.getElementById("f-concepto-italic")?.checked;
          const cIsBold = document.getElementById("f-concepto-bold")?.checked;
          const cFontSizePt = parseFloat(document.getElementById("f-concepto-fontsize")?.value || "44");
          const cFs = cFontSizePt * 2;
          const cFont = `${cIsBold ? "bold " : ""}${cIsItalic ? "italic " : ""}${cFs}px ${cFontFamily}`;
          drawTextInRect(ctx, document.getElementById("f-concepto-txt").value, cFont, cFontColor,
            coords.concepto.x * 2, coords.concepto.y * 2, coords.concepto.w * 2, coords.concepto.h * 2);
        }

        if (document.getElementById("f-fecha-on").checked && coords.fecha.set) {
          const fFontColor = document.getElementById("f-fecha-fontcolor")?.value || "#1a1a1a";
          const fFontFamily = document.getElementById("f-fecha-fontfamily")?.value || "Georgia, serif";
          const fIsItalic = document.getElementById("f-fecha-italic")?.checked;
          const fIsBold = document.getElementById("f-fecha-bold")?.checked;
          const fFontSizePt = parseFloat(document.getElementById("f-fecha-fontsize")?.value || "32");
          const fFs = fFontSizePt * 2;
          const fFont = `${fIsBold ? "bold " : ""}${fIsItalic ? "italic " : ""}${fFs}px ${fFontFamily}`;
          drawTextInRect(ctx, document.getElementById("f-fecha-txt").value, fFont, fFontColor,
            coords.fecha.x * 2, coords.fecha.y * 2, coords.fecha.w * 2, coords.fecha.h * 2);
        }

        if (document.getElementById("f-qr-on").checked && coords.qr.set) {
          const maxW = coords.qr.w * 2;
          const maxH = coords.qr.h * 2;
          const textSpace = 44;
          const qS = Math.min(maxW, maxH - textSpace);
          const qOffX = (maxW - qS) / 2;
          const elementHeight = qS + textSpace;
          const qOffY = (maxH - elementHeight) / 2;
          const qrX = coords.qr.x * 2 + qOffX;
          const qrY = coords.qr.y * 2 + qOffY;
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.src = qrUrl(nombre, fecha);
          await new Promise((r) => (img.onload = r));
          ctx.drawImage(img, qrX, qrY, qS, qS);
          ctx.textAlign = "center";
          ctx.font = "bold 14px sans-serif";
          ctx.fillStyle = "#8B1A2A";
          ctx.fillText(`Verificación ITD`, coords.qr.x * 2 + maxW / 2, qrY + qS + 18);
          ctx.font = "bold 12px sans-serif";
          ctx.fillStyle = "#0f172a";
          ctx.fillText(`${getDisplayDate()}`, coords.qr.x * 2 + maxW / 2, qrY + qS + 36);
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({
          orientation: pdfPageW > pdfPageH ? "l" : "p",
          unit: "pt",
          format: [pdfPageW, pdfPageH],
        });
        doc.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG", 0, 0, pdfPageW, pdfPageH);
        return doc.output("arraybuffer");
      }

      function loadScript(src) {
        return new Promise((r) => {
          const s = document.createElement("script");
          s.src = src;
          s.onload = r;
          document.head.appendChild(s);
        });
      }

      async function dlTodos() {
        if (GEN.length === 0) return;
        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
        const zip = new JSZip();
        GEN.forEach((g, i) => {
          const safeName = g.nombre.replace(/[^a-z0-9]/gi, "_").toLowerCase();
          zip.file(`constancia_${safeName}_${i + 1}.pdf`, g.pdfBytes);
        });
        const zipBlob = await zip.generateAsync({ type: "blob" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(zipBlob);
        a.download = `Constancias_Lote_${new Date().toISOString().split("T")[0]}.zip`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      async function printTodos() {
        if (GEN.length === 0) return;
        const okEl = document.getElementById("print-all-btn");
        const oldText = okEl.innerHTML;
        okEl.innerHTML = "⏳ Generando...";
        okEl.disabled = true;
        try {
          await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js");
          const { PDFDocument } = window.PDFLib;
          const mergedPdf = await PDFDocument.create();
          for (const g of GEN) {
            const pdfDoc = await PDFDocument.load(g.pdfBytes);
            const copiedPages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
            copiedPages.forEach((page) => mergedPdf.addPage(page));
          }
          const mergedPdfFile = await mergedPdf.save();
          const blob = new Blob([mergedPdfFile], { type: "application/pdf" });
          const blobUrl = URL.createObjectURL(blob);
          const win = window.open(blobUrl, "_blank");
          if (win) win.focus();
          else alert("Por favor, permite las ventanas emergentes para imprimir.");
        } catch (e) {
          console.error(e);
          alert("Error al generar vista de impresión");
        } finally {
          okEl.innerHTML = oldText;
          okEl.disabled = false;
        }
      }

      const getSS = () => {
        try { return JSON.parse(sessionStorage.getItem("itd_oc_s")); }
        catch { return null; }

      const setSS = (u) => sessionStorage.setItem("itd_oc_s", JSON.stringify(u));
      const delSS = () => sessionStorage.removeItem("itd_oc_s");

      async function h256(s) {
        const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
        return Array.from(new Uint8Array(b)).map((x) => x.toString(16).padStart(2, "0")).join("");
      }

      async function renderUsers() {

          empty = document.getElementById("usr-empty");

        list.innerHTML = '<div style="padding:20px;text-align:center;color:#aaa">Cargando…</div>';

          const resp = await fetch(`${SCRIPT_URL}?action=listUsers`);

          const users = data.users;
          const usrCnt = document.getElementById("usr-cnt");

      async function crearUsuario() {
        const name = document.getElementById("uf-nm").value.trim();
        const _ue = document.getElementById("uf-em").value.trim().toLowerCase();
        const email = _ue.includes("@") ? _ue : _ue + "@itdurango.edu.mx";
        const pass = document.getElementById("uf-pw").value.trim();
        const isAdm = document.getElementById("uf-adm").value === "true";
        const errEl = document.getElementById("uf-err"),
          btn = document.getElementById("uf-sv");
        errEl.classList.add("hidden");
        if (!name || !email || !pass) {
          errEl.textContent = "⚠ Todos los campos son requeridos.";
          errEl.classList.remove("hidden");
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          errEl.textContent = "⚠ Correo inválido.";
          errEl.classList.remove("hidden");
          return;
        }
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Guardando…';
        try {
          const hash = await h256(pass);
          const resp = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "createUser", name, email, hash, isAdmin: isAdm }),
          });
          const text = await resp.text();
          let data;
          try { data = JSON.parse(text); }
          catch (e) { throw new Error("Respuesta inválida: " + text.substring(0, 60)); }
          if (!data.ok) throw new Error(data.error || "Error al crear usuario");
          toggleUF(true);
          renderUsers();
          ["uf-nm", "uf-em", "uf-pw"].forEach((id) => (document.getElementById(id).value = ""));
          document.getElementById("uf-adm").value = "false";
          toast(`✅ Usuario ${email} creado`, "success");
        } catch (err) {
          errEl.textContent = "⚠ " + err.message;
          errEl.classList.remove("hidden");
        } finally {
          btn.disabled = false;
          btn.innerHTML = "💾 Crear usuario";
        }
      }
